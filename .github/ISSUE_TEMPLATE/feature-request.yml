name: Feature request
description: Suggest a Cosy capability (CLI, API, formats, pipeline)
labels: ["feature-request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the CLI flag / API request / behavior look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or earlier attempts
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - HTTP API
        - Rendering pipeline (fonts, markup, backgrounds)
        - Output formats
        - Docker / deployment
        - Docs
        - Other
    validations:
      required: true
