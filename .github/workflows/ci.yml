name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Verify templates
        run: |
          ./target/debug/cosy templates
          ./target/debug/cosy render -t social-quote -d templates/social-quote/defaults.json -o /tmp/test-quote.png --scale 1
          ./target/debug/cosy render -t carousel-default -d templates/carousel-default/defaults.json -o /tmp/test-carousel --scale 1
          ./target/debug/cosy render -t og-image -d templates/og-image/defaults.json -o /tmp/test-og.png --scale 1

  mutation-testing:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation tests
        run: cargo mutants --file src/schema.rs --file src/template.rs --file src/text.rs --file src/render.rs -j 2

      - name: Check mutation score
        run: |
          if [ -f mutants.out/missed.txt ]; then
            MISSED=$(wc -l < mutants.out/missed.txt)
            if [ "$MISSED" -gt 0 ]; then
              echo "::warning::${MISSED} mutants were not caught by tests"
              cat mutants.out/missed.txt
            else
              echo "All mutants caught!"
            fi
          fi
