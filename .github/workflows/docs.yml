name: Docs Build Check

# Docs are HOSTED on Cloudflare Pages (cosy-docs-4f5.pages.dev, deployed via
# wrangler from a machine with CF credentials — see docs deploy guide).
# GitHub Pages was never enabled for this repo, so the old push-triggered
# deploy workflow failed on every main push (issue #123).
#
# This workflow now runs on demand only (workflow_dispatch) and just verifies
# the VitePress build succeeds, uploading the built site as a regular artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: docs
      - run: bun run build
        working-directory: docs
      - name: Verify build output
        run: |
          if [ ! -d "docs/.vitepress/dist" ] || [ -z "$(ls -A docs/.vitepress/dist)" ]; then
            echo "::error::Build output is empty or missing."
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 7
