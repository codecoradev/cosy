name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION=${GITHUB_REF_NAME}
          ARCHIVE="cosy-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p staging
          # zigbuild puts output in target/x86_64-unknown-linux-gnu.2.17/release
          # regular build puts output in target/<target>/release
          BINARY=$(find target/ -name cosy -type f | head -1)
          cp "$BINARY" staging/
          cp -r templates staging/
          cp README.md LICENSE staging/
          tar czf "$ARCHIVE" -C staging .
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $archive = "cosy-${version}-${{ matrix.target }}.zip"
          mkdir staging
          Copy-Item target/${{ matrix.target }}/release/cosy.exe staging/
          Copy-Item -Recurse templates staging/
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Out-File -Encoding ascii "${archive}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cosy-${{ matrix.target }}
          path: |
            cosy-*.tar.gz
            cosy-*.tar.gz.sha256
            cosy-*.zip
            cosy-*.zip.sha256

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd release-assets
          cat *.sha256 > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cosy-*.tar.gz
            release-assets/cosy-*.zip
            SHA256SUMS.txt
