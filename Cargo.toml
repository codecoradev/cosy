[package]
name = "cosy"
version = "0.2.0"
edition = "2021"
description = "Content Easy — Lightning-fast template-based image generation in Rust"
license = "BSL-1.1"
authors = ["PT Azfirazka Digital Kreatif"]

[dependencies]
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# HTTP server (cosy serve)
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
