<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
  </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  {% if slide.tag %}
  <rect x="80" y="60" width="180" height="44" rx="22" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="170" y="88" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.tag }}</text>
  {% endif %}
  <text x="80" y="260" font-family="Space Grotesk,sans-serif" font-size="46" font-weight="700" fill="#cdd6f4">
    {% for line in headline_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}56{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not headline_lines %}<tspan x="80" dy="0">{{ slide.headline }}</tspan>{% endif %}
  </text>
  {% if slide.detail %}
  <text x="80" y="460" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#a6adc8">
    {% for line in detail_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
  </text>
  {% endif %}
  {% if slide.date %}
  <text x="1120" y="580" text-anchor="end" font-family="Inter,sans-serif" font-size="20" font-weight="400" fill="#7f849c">{{ slide.date }}</text>
  {% endif %}
  <text x="80" y="580" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  <circle cx="1120" cy="80" r="105" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="1072" y="502" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>
