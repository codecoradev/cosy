<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  {% if slide.method == 'GET' %}
  {% set mc = '#a6e3a1' %}
  {% elif slide.method == 'POST' %}
  {% set mc = '#cba6f7' %}
  {% elif slide.method == 'PUT' %}
  {% set mc = '#f9e2af' %}
  {% elif slide.method == 'DELETE' %}
  {% set mc = '#f38ba8' %}
  {% elif slide.method == 'PATCH' %}
  {% set mc = '#89b4fa' %}
  {% else %}
  {% set mc = '#cba6f7' %}
  {% endif %}
  <rect x="100" y="150" width="200" height="50" rx="10" fill="{{ mc }}" opacity="0.15"/>
  <text x="200" y="183" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="800" fill="{{ mc }}">{{ slide.method }}</text>
  <text x="330" y="183" font-family="JetBrains Mono,monospace" font-size="26" font-weight="500" fill="#cdd6f4">{{ slide.endpoint }}</text>
  {% if slide.auth_required %}
  <rect x="1000" y="150" width="120" height="50" rx="10" fill="#313244" opacity="0.4"/>
  <text x="1060" y="183" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="500" fill="#7f849c">Auth: {{ slide.auth_required }}</text>
  {% endif %}
  <rect x="100" y="150" width="1000" height="50" rx="10" fill="none" stroke="#313244" stroke-width="1"/>
  <rect x="100" y="260" width="1000" height="220" rx="12" fill="#11111b" opacity="0.5"/>
  <text x="140" y="310" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#a6adc8">
{% for line in description_lines %}    <tspan x="140" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="140">{{ slide.description }}</tspan>{% endif %}
  </text>
  <text x="600" y="610" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>