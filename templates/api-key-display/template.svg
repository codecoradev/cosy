<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="100" y="140" width="1000" height="100" rx="12" fill="#0c0c14" opacity="0.85"/>
  <text x="140" y="200" font-family="JetBrains Mono,monospace" font-size="28" fill="#89b4fa">{{ slide.key_prefix }}</text>
  <text x="280" y="200" font-family="JetBrains Mono,monospace" font-size="28" fill="#a6e3a1">{{ slide.key_body }}</text>
  <rect x="800" y="140" width="120" height="100" rx="0" fill="url(#bg-grad)" opacity="0.9"/>
  {% for i in range(20) %}
  <circle cx="{{ 810 + i * 5 }}" cy="190" r="4" fill="#a6adc8" opacity="0.9"/>
  {% endfor %}
  {% if slide.created %}
  <text x="100" y="310" font-family="Inter,sans-serif" font-size="20" fill="#7f849c">Created</text>
  <text x="100" y="340" font-family="Inter,sans-serif" font-size="22" fill="#cdd6f4">{{ slide.created }}</text>
  {% endif %}
  {% if slide.permissions %}
  <text x="500" y="310" font-family="Inter,sans-serif" font-size="20" fill="#7f849c">Permissions</text>
  <text x="500" y="340" font-family="Inter,sans-serif" font-size="22" fill="#cba6f7">{{ slide.permissions }}</text>
  {% endif %}
  {% if slide.last_used %}
  <text x="900" y="310" font-family="Inter,sans-serif" font-size="20" fill="#7f849c">Last Used</text>
  <text x="900" y="340" font-family="Inter,sans-serif" font-size="22" fill="#cdd6f4">{{ slide.last_used }}</text>
  {% endif %}
  <rect x="100" y="400" width="1000" height="2" fill="url(#acc-grad-h)" opacity="0.2"/>
  <text x="600" y="460" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Keep this key secure. You will not be able to see it again.</text>
  {% if brand.show_brand %}
  <text x="600" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>