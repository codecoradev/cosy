<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <g id="bg">
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}{{ brand.bg_overlay_opacity | default(0.7) }}{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  </g>

  {# Podcast name + episode label #}
  <g id="chrome">
  <text x="120" y="170" font-family="JetBrains Mono,monospace" font-size="24" fill="#7f849c">{{ slide.podcast_name }}</text>
  <rect x="120" y="200" width="150" height="4" rx="2" fill="url(#acc-grad)"/>
  <text x="120" y="265" font-family="Inter,sans-serif" font-size="26" font-weight="600" fill="#a6adc8">EPISODE {{ slide.episode_number }}</text>
  </g>

  {# Episode number hero #}
  <g id="f-episode_number">
  <text x="120" y="560" font-family="Space Grotesk,sans-serif" font-size="320" font-weight="800" fill="url(#acc-grad)">{{ slide.episode_number }}</text>
  </g>

  {# Title (wrapped) #}
  <g id="f-title" font-family="Space Grotesk,sans-serif" font-size="52" font-weight="700" fill="#cdd6f4">
    {% set ns = namespace(y = 700) %}
    {% for line in title_lines %}
    <text x="120" y="{{ ns.y }}">{{ line }}</text>
    {% set ns.y = ns.y + 62 %}
    {% endfor %}
  </g>

  {# Guest + duration meta row #}
  <g id="chrome">
  {% if slide.guest %}
  <text x="120" y="810" font-family="Inter,sans-serif" font-size="26" fill="#a6adc8">with <tspan font-weight="700" fill="#cdd6f4">{{ slide.guest }}</tspan></text>
  {% endif %}
  {% if slide.duration %}
  <g transform="translate(120, 870)" fill="none" stroke="#7f849c" stroke-width="2.4">
    <circle cx="16" cy="16" r="14"/>
    <path d="M16 8 L16 16 L23 20" stroke-linecap="round"/>
  </g>
  <text x="160" y="894" font-family="Inter,sans-serif" font-size="24" fill="#a6adc8">{{ slide.duration | default('') }}</text>
  {% endif %}
  </g>

  {# Static waveform: hand-tuned pseudo-random bar heights (CSV in a
     template string — deterministic, no stateful loop needed) #}
  <g id="f-waveform">
    {% set wave = "12,44,80,26,95,60,38,110,72,18,88,50,130,64,30,84,22,102,55,90,40,16,76,108,48,20,68,98,34,120,58,86,26,112,44,78,32,94,52,70" %}
    {% for h in wave | split(',') %}
      {% set bh = h | int %}
      <rect x="{{ 120 + loop.index0 * 21 }}" y="{{ 1180 - bh }}" width="11" rx="5" height="{{ bh }}" fill="url(#acc-grad)" opacity="{{ 0.45 + (bh / 260) | round(2) }}"/>
    {% endfor %}
  </g>

  {# Accent underline #}
  <g id="brand">
  <rect x="70" y="1250" width="940" height="4" rx="2" fill="url(#acc-grad)" opacity="0.85"/>

  {% if brand.show_brand %}
  <text x="540" y="1310" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}{% if brand.brand_handle %} · {{ brand.brand_handle }}{% endif %}</text>
  {% endif %}
  </g>
</svg>
