<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <!-- Avatar circle -->
  <circle cx="540" cy="300" r="100" fill="url(#acc-grad)" opacity="0.15"/>
  <circle cx="540" cy="300" r="100" fill="none" stroke="url(#acc-grad)" stroke-width="3" opacity="0.5"/>
  <!-- Initials -->
  <text x="540" y="320" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="56" font-weight="800" fill="url(#acc-grad)">{{ slide.name[:1] | default('A') | upper }}</text>

  <!-- Name -->
  <text x="540" y="480" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="44" font-weight="700" fill="#cdd6f4">{{ slide.name }}</text>

  <!-- Role -->
  {% if slide.role %}
  <text x="540" y="530" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="500" fill="url(#acc-grad)">{{ slide.role }}</text>
  {% endif %}

  <!-- Divider -->
  <rect x="440" y="570" width="200" height="3" rx="1.5" fill="url(#acc-grad-h)"/>

  <!-- Bio -->
  <text x="540" y="650" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="400" fill="#a6adc8">
{% for line in bio_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}36{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not bio_lines %}<tspan x="540">{{ slide.bio }}</tspan>{% endif %}
  </text>

  <!-- Tags -->
  {% set tags = [slide.tag1, slide.tag2, slide.tag3] %}
  {% set tag_x = [340, 500, 660] %}
  {% for tag in tags %}
  {% if tag %}
  <rect x="{{ tag_x[loop.index0] - 70 }}" y="900" width="140" height="42" rx="20" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="{{ tag_x[loop.index0] }}" y="927" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="url(#acc-grad)">{{ tag }}</text>
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1012" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>