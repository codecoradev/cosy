<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="675" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="675" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- Tag badge -->
  {% if slide.tag %}
  <rect x="100" y="120" width="180" height="40" rx="20" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="190" y="146" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="url(#acc-grad)">{{ slide.tag }}</text>
  {% endif %}

  <!-- Title -->
  <text x="100" y="310" font-family="Space Grotesk,sans-serif" font-size="52" font-weight="800" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}62{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="100">{{ slide.title }}</tspan>{% endif %}
  </text>

  <!-- Meta -->
  <line x1="100" y1="550" x2="200" y2="550" stroke="url(#acc-grad-h)" stroke-width="3"/>
  {% if slide.date %}
  <text x="100" y="590" font-family="Inter,sans-serif" font-size="18" font-weight="500" fill="#7f849c">{{ slide.date }}</text>
  {% endif %}
  {% if slide.read_time %}
  <text x="1100" y="590" text-anchor="end" font-family="Inter,sans-serif" font-size="18" font-weight="500" fill="#7f849c">{{ slide.read_time }}</text>
  {% endif %}

  <circle cx="1080" cy="100" r="140" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.05"/>
  {% if brand.show_brand %}
  <text x="600" y="645" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="1072" y="607" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>