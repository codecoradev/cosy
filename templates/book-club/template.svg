<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <rect x="390" y="120" width="300" height="420" rx="12" fill="#313244" opacity="0.3"/>
  <rect x="390" y="120" width="300" height="420" rx="12" fill="none" stroke="url(#acc-grad)" stroke-width="2" opacity="0.15"/>
  <text x="540" y="320" text-anchor="middle" font-size="80" fill="url(#acc-grad)" opacity="0.08">&#x1F4DA;</text>
  <text x="540" y="360" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">BOOK COVER</text>
  <text x="540" y="620" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="38" font-weight="700" fill="#cdd6f4">
{% for line in book_title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}48{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not book_title_lines %}<tspan x="540">{{ slide.book_title }}</tspan>{% endif %}
  </text>
  <text x="540" y="760" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="url(#acc-grad)">by {{ slide.author }}</text>
  {% if slide.rating %}
  <text x="540" y="810" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="#f9e2af">{{ slide.rating }} / 5</text>
  {% endif %}
  {% if slide.genre or slide.pages %}
  <rect x="290" y="840" width="500" height="44" rx="20" fill="#313244" opacity="0.3"/>
  {% if slide.genre %}<text x="420" y="868" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#a6adc8">{{ slide.genre }}</text>{% endif %}
  {% if slide.genre and slide.pages %}<text x="540" y="868" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#45475a">|</text>{% endif %}
  {% if slide.pages %}<text x="650" y="868" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#a6adc8">{{ slide.pages }} pages</text>{% endif %}
  {% endif %}
  <text x="540" y="960" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#a6adc8">
{% for line in takeaway_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not takeaway_lines %}<tspan x="540">{{ slide.takeaway }}</tspan>{% endif %}
  </text>
  {% if brand.show_brand %}
  <text x="540" y="1310" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>