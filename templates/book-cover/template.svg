<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1620" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1620" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1620" fill="url(#glow)"/>
  <rect width="1080" height="1620" fill="url(#dots)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#acc-grad-h)"/>
  <rect x="0" y="1610" width="1080" height="10" fill="url(#acc-grad-h)"/>
  {% if slide.edition %}
  <rect x="390" y="150" width="300" height="50" rx="25" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="540" y="182" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="url(#acc-grad)">{{ slide.edition }}</text>
  {% endif %}
  <text x="540" y="550" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="76" font-weight="900" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}90{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>
  <rect x="390" y="800" width="300" height="4" rx="2" fill="url(#acc-grad-h)"/>
  {% if slide.subtitle %}
  <text x="540" y="900" text-anchor="middle" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#a6adc8">
{% for line in subtitle_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}40{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not subtitle_lines %}<tspan x="540">{{ slide.subtitle }}</tspan>{% endif %}
  </text>
  {% endif %}
  <text x="540" y="1450" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="url(#acc-grad)">{{ slide.author }}</text>
  <text x="540" y="1530" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1552" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>