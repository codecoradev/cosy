<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#181825') }}"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
  </pattern>
  </defs>

  <!-- Gradient background -->
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-gradient)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>

  <!-- Brand header -->
  <rect x="80" y="60" width="6" height="36" rx="8" fill="url(#accent-gradient)"/>
  {% if brand.show_brand %}
  <text x="100" y="88" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#cdd6f4">
    {{ brand.brand_name | default('') }}
  </text>
  {% endif %}

  <!-- Eyebrow -->
  {% if slide.eyebrow %}
  <text x="80" y="220" font-family="JetBrains Mono, monospace" font-size="22" font-weight="400" fill="{{ brand.accent_color | default('#cba6f7') }}" letter-spacing="2">
    {{ slide.eyebrow | upper }}
  </text>
  {% endif %}

  <!-- Accent bar -->
  <rect x="80" y="260" width="60" height="6" rx="8" fill="url(#accent-gradient)"/>

  <!-- Headline (wrapped) -->
  <text x="80" y="360" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#cdd6f4">
    {% for line in headline_lines %}
    <tspan x="80" dy="{% if loop.first %}0{% else %}68{% endif %}">{{ line }}</tspan>
    {% endfor %}
    {% if not headline_lines %}
    <tspan x="80" dy="0">{{ slide.headline }}</tspan>
    {% endif %}
  </text>

  <!-- Body text (wrapped) -->
  {% if slide.body %}
  <text x="80" y="700" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#a6adc8">
    {% for line in body_lines %}
    <tspan x="80" dy="{% if loop.first %}0{% else %}44{% endif %}">{{ line }}</tspan>
    {% endfor %}
    {% if not body_lines %}
    <tspan x="80" dy="0">{{ slide.body }}</tspan>
    {% endif %}
  </text>
  {% endif %}

  <!-- Brand footer -->
  {% if brand.show_brand %}
  <text x="80" y="1290" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#7f849c">
    {{ brand.brand_name | default('') }} · {{ brand.brand_handle | default('') }}
  </text>
  {% endif %}
  <circle cx="1000" cy="80" r="180" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1222" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>
