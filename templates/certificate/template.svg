<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="900" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="900" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <rect x="40" y="40" width="1120" height="820" rx="12" fill="none" stroke="url(#acc-grad)" stroke-width="3" opacity="0.4"/>
  <rect x="60" y="60" width="1080" height="780" rx="8" fill="none" stroke="url(#acc-grad)" stroke-width="1" opacity="0.2"/>
  <text x="600" y="200" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="url(#acc-grad)">{{ slide.title }}</text>
  <rect x="500" y="240" width="200" height="2" fill="url(#acc-grad-h)" opacity="0.4"/>
  <text x="600" y="320" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="400" fill="#7f849c">This certificate is proudly presented to</text>
  <text x="600" y="430" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="56" font-weight="700" fill="#cdd6f4">{{ slide.recipient }}</text>
  <text x="600" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#a6adc8">
{% for line in description_lines %}    <tspan x="600" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="600">{{ slide.description }}</tspan>{% endif %}
  </text>
  <text x="350" y="730" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="#7f849c">{{ slide.date }}</text>
  <line x1="240" y1="750" x2="460" y2="750" stroke="#45475a" stroke-width="1"/>
  <text x="350" y="775" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#7f849c">Date</text>
  <text x="850" y="730" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="#7f849c">{{ slide.issuer }}</text>
  <line x1="740" y1="750" x2="960" y2="750" stroke="#45475a" stroke-width="1"/>
  <text x="850" y="775" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#7f849c">Issued by</text>
  <text x="600" y="860" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>