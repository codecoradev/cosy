<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <text x="120" y="140" font-family="JetBrains Mono,monospace" font-size="56" font-weight="800" fill="url(#acc-grad)">{{ slide.version }}</text>
  {% if slide.date %}
  <text x="120" y="180" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ slide.date }}</text>
  {% endif %}
  <rect x="120" y="210" width="840" height="2" rx="8" fill="#313244"/>
  <text x="120" y="280" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#a6e3a1">NEW</text>
  {% set features = [slide.feature1, slide.feature2, slide.feature3] %}
  {% set feat_lines = [feature1_lines, feature2_lines, feature3_lines] %}
  {% set feat_y = 320 %}
  {% for feat in features %}
  {% if feat %}
  <text x="160" y="{{ feat_y + loop.index0 * 50 }}" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#cdd6f4">
    {% set fl = feat_lines[loop.index0] %}
    {% if fl %}{% for line in fl %}<tspan x="160" dy="{% if loop.first %}0{% else %}30{% endif %}">{{ line }}</tspan>{% endfor %}{% else %}<tspan x="160">{{ feat }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% endfor %}
  {% if slide.fix1 %}
  <text x="120" y="{{ feat_y + 3 * 50 + 30 }}" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#f9e2af">FIXED</text>
  {% set fix_y = feat_y + 3 * 50 + 70 %}
  {% set fixes = [slide.fix1, slide.fix2] %}
  {% for fix in fixes %}
  {% if fix %}
  <text x="160" y="{{ fix_y + loop.index0 * 50 }}" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#cdd6f4">{{ fix }}</text>
  {% endif %}
  {% endfor %}
  {% endif %}
  <text x="540" y="1270" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>