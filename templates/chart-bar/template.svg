<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="120" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}46{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>
  {% set bars = [
    (slide.b1_label, slide.b1_value, 0),
    (slide.b2_label, slide.b2_value, 1),
    (slide.b3_label, slide.b3_value, 2),
    (slide.b4_label, slide.b4_value, 3),
    (slide.b5_label, slide.b5_value, 4)
  ] %}
  {% for b in bars %}
  {% if b[0] %}
  {% set bx = 120 + b[2] * 180 %}
  {% set bh = b[1] | int * 4 %}
  {% set by = 850 - bh %}
  <rect x="{{ bx }}" y="{{ by }}" width="120" height="{{ bh }}" rx="12" fill="url(#acc-grad)" opacity="0.7"/>
  <text x="{{ bx + 60 }}" y="{{ by - 15 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="url(#acc-grad)">{{ b[1] }}</text>
  <text x="{{ bx + 60 }}" y="890" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">{{ b[0] }}</text>
  {% endif %}
  {% endfor %}
  <rect x="100" y="850" width="880" height="2" fill="#313244" opacity="0.5"/>
  <text x="540" y="1040" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>