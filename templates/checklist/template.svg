<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
  </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <rect x="80" y="100" width="6" height="60" rx="8" fill="url(#acc-grad)"/>
  <text x="80" y="220" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="700" fill="#cdd6f4">
    {% for line in title_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}58{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="80" dy="0">{{ slide.title }}</tspan>{% endif %}
  </text>
  {% if slide.item1 %}
  <circle cx="110" cy="420" r="16" fill="url(#acc-grad)"/>
  <path d="M102,420 l5,6 l11,-13" stroke="#1e1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="428" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#bac2de">{{ slide.item1 }}</text>
  {% endif %}
  {% if slide.item2 %}
  <circle cx="110" cy="560" r="16" fill="url(#acc-grad)"/>
  <path d="M102,560 l5,6 l11,-13" stroke="#1e1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="568" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#bac2de">{{ slide.item2 }}</text>
  {% endif %}
  {% if slide.item3 %}
  <circle cx="110" cy="700" r="16" fill="url(#acc-grad)"/>
  <path d="M102,700 l5,6 l11,-13" stroke="#1e1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="708" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#bac2de">{{ slide.item3 }}</text>
  {% endif %}
  {% if slide.item4 %}
  <circle cx="110" cy="840" r="16" fill="url(#acc-grad)"/>
  <path d="M102,840 l5,6 l11,-13" stroke="#1e1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="848" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#bac2de">{{ slide.item4 }}</text>
  {% endif %}
  {% if slide.item5 %}
  <circle cx="110" cy="980" r="16" fill="url(#acc-grad)"/>
  <path d="M102,980 l5,6 l11,-13" stroke="#1e1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="988" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#bac2de">{{ slide.item5 }}</text>
  {% endif %}
  <text x="540" y="1280" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ brand.brand_name | default('') }} · {{ brand.brand_handle | default('') }}</text>
  <circle cx="1000" cy="80" r="180" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1222" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>
