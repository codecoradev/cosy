<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  {% set is_success = slide.exit_code == '0' %}
  <rect x="80" y="80" width="920" height="60" rx="10" fill="#0c0c14" opacity="0.85"/>
  <text x="110" y="120" font-family="JetBrains Mono,monospace" font-size="22" fill="#cdd6f4">$ {{ slide.command }}</text>
  <rect x="80" y="170" width="920" height="700" rx="12" fill="#0c0c14" opacity="0.75"/>
  {% if is_success %}
  <rect x="80" y="170" width="920" height="6" rx="3" fill="#a6e3a1" opacity="0.5"/>
  {% else %}
  <rect x="80" y="170" width="920" height="6" rx="3" fill="#f38ba8" opacity="0.5"/>
  {% endif %}
  {% if slide.stdout_line1 %}<text x="110" y="230" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6adc8">{{ slide.stdout_line1 }}</text>{% endif %}
  {% if slide.stdout_line2 %}<text x="110" y="270" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6adc8">{{ slide.stdout_line2 }}</text>{% endif %}
  {% if slide.stdout_line3 %}<text x="110" y="310" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6adc8">{{ slide.stdout_line3 }}</text>{% endif %}
  {% if slide.stderr_line1 %}<text x="110" y="370" font-family="JetBrains Mono,monospace" font-size="18" fill="#f38ba8">{{ slide.stderr_line1 }}</text>{% endif %}
  <line x1="110" y1="780" x2="970" y2="780" stroke="#313244" stroke-width="1" opacity="0.3"/>
  <text x="110" y="830" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Exit Code:</text>
  <text x="230" y="830" font-family="JetBrains Mono,monospace" font-size="22" font-weight="700" fill="{% if is_success %}#a6e3a1{% else %}#f38ba8{% endif %}">{{ slide.exit_code }}</text>
  {% if slide.duration %}
  <text x="400" y="830" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Duration:</text>
  <text x="520" y="830" font-family="JetBrains Mono,monospace" font-size="22" fill="#cdd6f4">{{ slide.duration }}</text>
  {% endif %}
  <text x="540" y="1055" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>