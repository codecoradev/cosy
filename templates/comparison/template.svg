<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
  </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <text x="540" y="180" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="44" font-weight="700" fill="#cdd6f4">
    {% for line in title_lines %}<tspan x="540" dy="{% if loop.first %}0{% else %}54{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540" dy="0">{{ slide.title }}</tspan>{% endif %}
  </text>
  <line x1="540" y1="390" x2="540" y2="1190" stroke="#45475a" stroke-width="2"/>
  <!-- Left: Before -->
  <text x="270" y="580" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="600" fill="#a6adc8">{{ slide.before_label | default('Before') }}</text>
  <text x="270" y="780" text-anchor="middle" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#a6adc8">
    {% set bn = before_text_lines|length %}{% set pitch = [370 / (bn - 1), 150]|min|int if bn > 1 else 0 %}{% for line in before_text_lines %}<tspan x="270" dy="{{ 0 if loop.first else pitch }}">{{ line }}</tspan>{% endfor %}
  </text>
  <!-- Right: After -->
  <text x="810" y="580" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.after_label | default('After') }}</text>
  <text x="810" y="780" text-anchor="middle" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#cdd6f4">
    {% set an = after_text_lines|length %}{% set apitch = [370 / (an - 1), 150]|min|int if an > 1 else 0 %}{% for line in after_text_lines %}<tspan x="810" dy="{{ 0 if loop.first else apitch }}">{{ line }}</tspan>{% endfor %}
  </text>
  {% if brand.show_brand %}
  <text x="540" y="1320" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  <circle cx="1000" cy="80" r="180" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1222" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>
