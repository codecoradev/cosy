<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="200" cy="315" r="90" fill="none" stroke="url(#acc-grad)" stroke-width="3" opacity="0.4"/>
  <circle cx="200" cy="315" r="80" fill="#313244" opacity="0.3"/>
  <text x="200" y="335" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="56" font-weight="800" fill="url(#acc-grad)">{{ slide.username | first | upper }}</text>
  <text x="350" y="250" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.username }}</text>
  {% if slide.role %}
  <text x="350" y="290" font-family="Inter,sans-serif" font-size="22" fill="#7f849c">{{ slide.role }}</text>
  {% endif %}
  {% if slide.repo %}
  <text x="350" y="325" font-family="JetBrains Mono,monospace" font-size="18" fill="#89b4fa">{{ slide.repo }}</text>
  {% endif %}
  <rect x="350" y="360" width="160" height="60" rx="12" fill="#313244" opacity="0.2"/>
  <text x="430" y="385" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ slide.commits | default('0') }}</text>
  <text x="430" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#7f849c">commits</text>
  <rect x="540" y="360" width="160" height="60" rx="12" fill="#313244" opacity="0.2"/>
  <text x="620" y="385" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ slide.prs | default('0') }}</text>
  <text x="620" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#7f849c">PRs merged</text>
  {% if brand.show_brand %}
  <text x="600" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>