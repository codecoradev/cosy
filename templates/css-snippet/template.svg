<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="90" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="100" y="150" width="1000" height="380" rx="12" fill="#11111b" opacity="0.7"/>
  <rect x="100" y="150" width="1000" height="380" rx="12" fill="none" stroke="#313244" stroke-width="1"/>
  <rect x="100" y="150" width="1000" height="45" rx="12" fill="#313244" opacity="0.5"/>
  <circle cx="125" cy="173" r="7" fill="#f38ba8" opacity="0.6"/>
  <circle cx="145" cy="173" r="7" fill="#f9e2af" opacity="0.6"/>
  <circle cx="165" cy="173" r="7" fill="#a6e3a1" opacity="0.6"/>
  <text x="600" y="177" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="#7f849c">styles.css</text>
  <text x="140" y="260" font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#f9e2af">{{ slide.selector }}</text>
  <text x="250" y="260" font-family="JetBrains Mono,monospace" font-size="28" fill="#7f849c">{</text>
  {% set props = [
    (slide.property1, slide.value1),
    (slide.property2, slide.value2),
    (slide.property3, slide.value3)
  ] %}
  {% for p in props %}
  {% if p[0] %}
  <text x="190" y="{{ 310 + loop.index0 * 55 }}" font-family="JetBrains Mono,monospace" font-size="24" fill="#89b4fa">{{ p[0] }}:</text>
  <text x="400" y="{{ 310 + loop.index0 * 55 }}" font-family="JetBrains Mono,monospace" font-size="24" fill="#a6e3a1">{{ p[1] }};</text>
  {% endif %}
  {% endfor %}
  <text x="140" y="{{ 310 + props | length * 55 }}" font-family="JetBrains Mono,monospace" font-size="28" fill="#7f849c">}</text>
  {% if brand.show_brand %}
  <text x="600" y="610" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>