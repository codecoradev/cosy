<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="90" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="390" y="140" width="300" height="70" rx="12" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="540" y="185" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ slide.root }}</text>
  <line x1="540" y1="210" x2="260" y2="360" stroke="#313244" stroke-width="2" opacity="0.5"/>
  <line x1="540" y1="210" x2="540" y2="360" stroke="#313244" stroke-width="2" opacity="0.5"/>
  <line x1="540" y1="210" x2="820" y2="360" stroke="#313244" stroke-width="2" opacity="0.5"/>
  {% set children = [(slide.child1, 260), (slide.child2, 540), (slide.child3, 820)] %}
  {% for c in children %}
  {% if c[0] %}
  <rect x="{{ c[1] - 130 }}" y="360" width="260" height="60" rx="12" fill="#313244" opacity="0.2"/>
  <text x="{{ c[1] }}" y="398" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="#cdd6f4">{{ c[0] }}</text>
  {% endif %}
  {% endfor %}
  {% set leaves = [(slide.leaf1, 140), (slide.leaf2, 380), (slide.leaf3, 700), (slide.leaf4, 940)] %}
  {% for l in leaves %}
  {% if l[0] %}
  <line x1="{{ l[1] }}" y1="420" x2="{{ l[1] }}" y2="580" stroke="#313244" stroke-width="1" opacity="0.3"/>
  <rect x="{{ l[1] - 100 }}" y="580" width="200" height="50" rx="12" fill="#1e1e2e" opacity="0.4"/>
  <text x="{{ l[1] }}" y="612" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">{{ l[0] }}</text>
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1040" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>