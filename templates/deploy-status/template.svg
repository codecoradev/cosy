<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="100" y="120" width="280" height="60" rx="10" fill="url(#acc-grad)" opacity="0.12"/>
  <text x="240" y="160" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="url(#acc-grad)">{{ slide.environment }}</text>
  <rect x="420" y="120" width="280" height="60" rx="10" fill="#313244" opacity="0.12"/>
  <text x="560" y="160" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="22" fill="#cdd6f4">{{ slide.version }}</text>
  {% if slide.commit %}
  <rect x="740" y="120" width="240" height="60" rx="10" fill="#313244" opacity="0.12"/>
  <text x="860" y="160" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="18" fill="#89b4fa">{{ slide.commit }}</text>
  {% endif %}
  {% set stages = [(slide.s1_name, slide.s1_status), (slide.s2_name, slide.s2_status), (slide.s3_name, slide.s3_status), (slide.s4_name, slide.s4_status)] %}
  {% for st in stages %}
  {% if st[0] %}
  {% set is_done = st[1] == 'success' or st[1] == 'Success' %}
  {% set is_run = st[1] == 'running' or st[1] == 'Running' %}
  {% set is_fail = st[1] == 'failed' or st[1] == 'Failed' %}
  <rect x="100" y="{{ 240 + loop.index0 * 150 }}" width="880" height="120" rx="16" fill="#313244" opacity="0.12"/>
  <rect x="100" y="{{ 240 + loop.index0 * 150 }}" width="8" height="120" rx="4" fill="{% if is_done %}#a6e3a1{% elif is_run %}#f9e2af{% elif is_fail %}#f38ba8{% else %}#7f849c{% endif %}" opacity="0.6"/>
  <text x="140" y="{{ 290 + loop.index0 * 150 }}" font-family="Space Grotesk,sans-serif" font-size="26" font-weight="600" fill="#cdd6f4">{{ st[0] }}</text>
  <text x="140" y="{{ 325 + loop.index0 * 150 }}" font-family="Inter,sans-serif" font-size="18" fill="{% if is_done %}#a6e3a1{% elif is_run %}#f9e2af{% elif is_fail %}#f38ba8{% else %}#7f849c{% endif %}">{{ st[1] }}</text>
  {% if is_done %}
  <text x="920" y="{{ 310 + loop.index0 * 150 }}" text-anchor="end" font-size="36" fill="#a6e3a1" font-family="Space Grotesk,sans-serif">&#x2713;</text>
  {% elif is_run %}
  <text x="920" y="{{ 310 + loop.index0 * 150 }}" text-anchor="end" font-size="32" fill="#f9e2af" font-family="Space Grotesk,sans-serif">...</text>
  {% endif %}
  {% endif %}
  {% endfor %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>