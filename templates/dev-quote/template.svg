<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
  </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg-grad)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect x="60" y="120" width="960" height="820" rx="16" fill="#181825" opacity="0.8"/>
  <rect x="60" y="120" width="960" height="60" rx="16" fill="#11111b"/>
  <rect x="60" y="150" width="960" height="30" fill="#11111b"/>
  <circle cx="100" cy="150" r="8" fill="#f38ba8"/>
  <circle cx="128" cy="150" r="8" fill="#f9e2af"/>
  <circle cx="156" cy="150" r="8" fill="#a6e3a1"/>
  <text x="940" y="156" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="18" fill="#7f849c">{{ slide.filename | default('main.rs') }}</text>
  <text x="100" y="260" font-family="JetBrains Mono,monospace" font-size="26" fill="#cdd6f4">
    {% for line in code_snippet_lines %}<tspan x="100" dy="{% if loop.first %}0{% else %}38{% endif %}">{{ line }}</tspan>{% endfor %}
  </text>
  <rect x="60" y="940" width="180" height="44" rx="22" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="150" y="968" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="20" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.language | default('Rust') }}</text>
  <text x="940" y="968" text-anchor="end" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  <circle cx="1000" cy="80" r="180" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
</svg>
