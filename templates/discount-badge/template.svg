<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="800" height="800" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="800" height="800" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <rect width="800" height="800" fill="url(#dots)"/>
  <circle cx="400" cy="400" r="280" fill="url(#acc-grad)" opacity="0.08"/>
  <circle cx="400" cy="400" r="260" fill="none" stroke="url(#acc-grad)" stroke-width="4" opacity="0.3"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="url(#acc-grad)" stroke-width="1" opacity="0.2" stroke-dasharray="8 8"/>
  <text x="400" y="340" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="100" font-weight="900" fill="url(#acc-grad)">{{ slide.discount }}</text>
  <text x="400" y="430" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="600" fill="#cdd6f4">
{% for line in label_lines %}    <tspan x="400" dy="{% if loop.first %}0{% else %}36{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not label_lines %}<tspan x="400">{{ slide.label }}</tspan>{% endif %}
  </text>
  {% if slide.code %}
  <rect x="260" y="530" width="280" height="50" rx="30" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="400" y="562" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="24" font-weight="700" fill="url(#acc-grad)">{{ slide.code }}</text>
  {% endif %}
  {% if slide.expires %}
  <text x="400" y="630" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="400" fill="#7f849c">{{ slide.expires }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="400" y="770" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="672" y="732" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>