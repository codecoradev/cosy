<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="380" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="200" font-weight="800" fill="url(#acc-grad)" opacity="0.15">{{ slide.error_code }}</text>
  <text x="540" y="350" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="160" font-weight="800" fill="url(#acc-grad)">{{ slide.error_code }}</text>
  <text x="540" y="500" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="700" fill="#cdd6f4">
{% for line in message_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}50{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not message_lines %}<tspan x="540">{{ slide.message }}</tspan>{% endif %}
  </text>
  {% if slide.submessage %}
  <text x="540" y="640" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" fill="#7f849c">
{% for line in submessage_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not submessage_lines %}<tspan x="540">{{ slide.submessage }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% if slide.button_text %}
  <rect x="390" y="780" width="300" height="60" rx="30" fill="url(#acc-grad)" opacity="0.2"/>
  <rect x="390" y="780" width="300" height="60" rx="30" fill="none" stroke="url(#acc-grad)" stroke-width="2"/>
  <text x="540" y="818" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="url(#acc-grad)">{{ slide.button_text }}</text>
  {% endif %}
  <text x="540" y="1040" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>