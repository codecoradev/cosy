<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#acc-grad-h)"/>
  <rect x="140" y="150" width="140" height="50" rx="8" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="210" y="183" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="url(#acc-grad)">EVENT</text>
  <text x="540" y="400" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="60" font-weight="900" fill="#cdd6f4">
{% for line in event_name_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}72{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not event_name_lines %}<tspan x="540">{{ slide.event_name }}</tspan>{% endif %}
  </text>
  <rect x="440" y="580" width="200" height="4" rx="2" fill="url(#acc-grad-h)"/>
  <text x="540" y="660" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="32" font-weight="700" fill="url(#acc-grad)">{{ slide.date }}</text>
  {% if slide.time %}
  <text x="540" y="710" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="500" fill="#a6adc8">{{ slide.time }}</text>
  {% endif %}
  <text x="540" y="800" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="#cdd6f4">
{% for line in location_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not location_lines %}<tspan x="540">{{ slide.location }}</tspan>{% endif %}
  </text>
  {% if slide.speaker %}
  <rect x="370" y="900" width="340" height="50" rx="25" fill="#313244" opacity="0.5"/>
  <text x="540" y="932" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="url(#acc-grad)">Featuring: {{ slide.speaker }}</text>
  {% endif %}
  {% if slide.description %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">
{% for line in description_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}30{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="540">{{ slide.description }}</tspan>{% endif %}
  </text>
  {% endif %}
  <text x="540" y="1270" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1282" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>