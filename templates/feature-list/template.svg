<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <text x="540" y="120" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="42" font-weight="800" fill="#cdd6f4">{{ slide.title }}</text>
  {% if slide.subtitle %}
  <text x="540" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#7f849c">{{ slide.subtitle }}</text>
  {% endif %}
  {% set feats = [
    (slide.f1_title, slide.f1_desc),
    (slide.f2_title, slide.f2_desc),
    (slide.f3_title, slide.f3_desc),
    (slide.f4_title, slide.f4_desc),
    (slide.f5_title, slide.f5_desc)
  ] %}
  {% for f in feats %}
  {% if f[0] %}
  {% set fy = 270 + loop.index0 * 200 %}
  <circle cx="180" cy="{{ fy }}" r="24" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="180" y="{{ fy + 8 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="700" fill="url(#acc-grad)">&#x2713;</text>
  <text x="230" y="{{ fy - 5 }}" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="#cdd6f4">{{ f[0] }}</text>
  {% if f[1] %}
  <text x="230" y="{{ fy + 35 }}" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ f[1] }}</text>
  {% endif %}
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1320" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>