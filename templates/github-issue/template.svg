<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="80" y="120" width="1040" height="390" rx="12" fill="#313244" opacity="0.2"/>
  <rect x="80" y="120" width="8" height="390" rx="8" fill="url(#acc-grad)" opacity="0.4"/>
  {% if slide.status %}
  <rect x="830" y="145" width="260" height="40" rx="20" fill="url(#acc-grad)" opacity="0.12"/>
  <text x="960" y="171" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="url(#acc-grad)">{{ slide.status }}</text>
  {% endif %}
  <text x="130" y="175" font-family="Inter,sans-serif" font-size="18" font-weight="500" fill="#7f849c">{{ slide.issue_num }}</text>
  <text x="130" y="260" font-family="Space Grotesk,sans-serif" font-size="34" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="130" dy="{% if loop.first %}0{% else %}44{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="130">{{ slide.title }}</tspan>{% endif %}
  </text>
  {% if slide.label1 %}
  <rect x="130" y="380" width="140" height="36" rx="20" fill="#cba6f7" opacity="0.15"/>
  <text x="200" y="403" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="500" fill="#cba6f7">{{ slide.label1 }}</text>
  {% endif %}
  {% if slide.label2 %}
  <rect x="285" y="380" width="140" height="36" rx="20" fill="#89b4fa" opacity="0.15"/>
  <text x="355" y="403" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="500" fill="#89b4fa">{{ slide.label2 }}</text>
  {% endif %}
  {% if slide.author %}
  <text x="130" y="465" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Opened by {{ slide.author }}</text>
  {% endif %}
  {% if slide.comments %}
  <text x="1060" y="465" text-anchor="end" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">{{ slide.comments }} comments</text>
  {% endif %}
  <text x="600" y="610" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>