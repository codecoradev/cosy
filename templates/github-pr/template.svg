<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="80" y="120" width="1040" height="390" rx="12" fill="#313244" opacity="0.2"/>
  <rect x="80" y="120" width="8" height="390" rx="8" fill="#a6e3a1" opacity="0.4"/>
  {% if slide.status %}
  <rect x="830" y="145" width="260" height="40" rx="20" fill="#a6e3a1" opacity="0.12"/>
  <text x="960" y="171" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#a6e3a1">{{ slide.status }}</text>
  {% endif %}
  <text x="130" y="175" font-family="Inter,sans-serif" font-size="18" font-weight="500" fill="#7f849c">{{ slide.pr_num }}</text>
  <text x="130" y="260" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="130" dy="{% if loop.first %}0{% else %}44{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="130">{{ slide.title }}</tspan>{% endif %}
  </text>
  <text x="130" y="380" font-family="JetBrains Mono,monospace" font-size="20" fill="#89b4fa">{{ slide.branch }}</text>
  <text x="130" y="380" font-family="JetBrains Mono,monospace" font-size="20" fill="#7f849c" opacity="0">
{% set _ = 0 %}</text>
  <rect x="130" y="400" width="140" height="40" rx="20" fill="#313244" opacity="0.4"/>
  <text x="200" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="500" fill="#a6e3a1">+{{ slide.additions | default('0') }}</text>
  <rect x="285" y="400" width="140" height="40" rx="20" fill="#313244" opacity="0.4"/>
  <text x="355" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="500" fill="#f38ba8">-{{ slide.deletions | default('0') }}</text>
  {% if slide.files_changed %}
  <text x="1060" y="426" text-anchor="end" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">{{ slide.files_changed }} files</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="600" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>