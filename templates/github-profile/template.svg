<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="540" cy="280" r="80" fill="none" stroke="url(#acc-grad)" stroke-width="4" opacity="0.5"/>
  <circle cx="540" cy="280" r="70" fill="#313244" opacity="0.3"/>
  <text x="540" y="300" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="url(#acc-grad)">{{ slide.username | first | upper }}</text>
  {% if slide.display_name %}
  <text x="540" y="430" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.display_name }}</text>
  {% endif %}
  <text x="540" y="475" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="22" font-weight="500" fill="#7f849c">{{ slide.username }}</text>
  {% if slide.bio %}
  <text x="540" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#a6adc8">
{% for line in bio_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}32{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not bio_lines %}<tspan x="540">{{ slide.bio }}</tspan>{% endif %}
  </text>
  {% endif %}
  <rect x="200" y="720" width="200" height="100" rx="12" fill="#313244" opacity="0.2"/>
  <text x="300" y="765" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="800" fill="url(#acc-grad)">{{ slide.repos | default('0') }}</text>
  <text x="300" y="800" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Repos</text>
  <rect x="440" y="720" width="200" height="100" rx="12" fill="#313244" opacity="0.2"/>
  <text x="540" y="765" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="800" fill="url(#acc-grad)">{{ slide.followers | default('0') }}</text>
  <text x="540" y="800" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Followers</text>
  <rect x="680" y="720" width="200" height="100" rx="12" fill="#313244" opacity="0.2"/>
  <text x="780" y="765" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="800" fill="url(#acc-grad)">{{ slide.following | default('0') }}</text>
  <text x="780" y="800" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Following</text>
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>