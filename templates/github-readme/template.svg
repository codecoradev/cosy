<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg-grad)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="80" y="100" width="6" height="60" rx="3" fill="url(#acc-grad)"/>
  <text x="80" y="240" font-family="Inter,sans-serif" font-size="52" font-weight="700" fill="#cdd6f4">
    {% for line in title_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}64{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="80" dy="0">{{ slide.title }}</tspan>{% endif %}
  </text>
  {% if slide.description %}
  <text x="80" y="400" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#a6adc8">
    {% for line in description_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
  </text>
  {% endif %}
  {% if slide.tech_stack %}
  <text x="80" y="560" font-family="JetBrains Mono,monospace" font-size="22" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.tech_stack }}</text>
  {% endif %}
  <text x="1200" y="580" text-anchor="end" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>
