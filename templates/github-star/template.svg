<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="100" y="150" font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#7f849c">github.com/</text>
  <text x="100" y="230" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="#cdd6f4">{{ slide.repo_name }}</text>
  <rect x="100" y="270" width="60" height="3" rx="1.5" fill="url(#acc-grad-h)"/>
  <text x="100" y="350" font-family="Inter,sans-serif" font-size="26" font-weight="400" fill="#a6adc8">
{% for line in description_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}36{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="100">{{ slide.description }}</tspan>{% endif %}
  </text>
  <rect x="900" y="420" width="120" height="42" rx="20" fill="#313244" opacity="0.6"/>
  <text x="960" y="448" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="url(#acc-grad)">{{ slide.language | default('Rust') }}</text>
  <text x="100" y="480" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="#7f849c">
    ⭐ {{ slide.stars }} stars{% if slide.forks %} · {{ slide.forks }} forks{% endif %}
  </text>
  <circle cx="1050" cy="150" r="120" fill="url(#acc-grad)" opacity="0.05"/>
  {% if brand.show_brand %}
  <text x="600" y="590" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>