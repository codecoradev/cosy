<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="110" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  {% set ring_circumference = 1131 %}{% set arc = (ring_circumference * slide.current / slide.target)|int if slide.target else 0 %}
  <circle cx="320" cy="575" r="180" fill="none" stroke="#313244" stroke-width="22"/>
  <circle cx="320" cy="575" r="180" fill="none" stroke="url(#acc-grad)" stroke-width="22" stroke-dasharray="{{ arc }}" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 320 575)"/>
  <text x="320" y="580" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="68" font-weight="800" fill="url(#acc-grad)">{{ slide.current }}</text>
  <text x="320" y="625" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#7f849c">/ {{ slide.target }}{% if slide.unit %} {{ slide.unit }}{% endif %}</text>
  {% set goals = [
    (slide.goal1, slide.goal1_done),
    (slide.goal2, slide.goal2_done),
    (slide.goal3, slide.goal3_done),
    (slide.goal4, slide.goal4_done)
  ] %}
  {% for g in goals %}
  {% if g[0] %}
  {% set gy = 410 + loop.index0 * 110 %}
  {% if g[1] | lower == 'yes' %}
  <circle cx="580" cy="{{ gy - 8 }}" r="18" fill="url(#acc-grad)" opacity="0.25"/>
  <text x="580" y="{{ gy - 2 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="url(#acc-grad)">&#x2713;</text>
  <text x="620" y="{{ gy }}" font-family="Inter,sans-serif" font-size="26" font-weight="400" fill="#7f849c" text-decoration="line-through">{{ g[0] }}</text>
  {% else %}
  <circle cx="580" cy="{{ gy - 8 }}" r="18" fill="none" stroke="#45475a" stroke-width="2"/>
  <text x="620" y="{{ gy }}" font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="#cdd6f4">{{ g[0] }}</text>
  {% endif %}
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>