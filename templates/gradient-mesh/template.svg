<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <radialGradient id="mesh1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="80%" cy="20%" r="35%">
      <stop offset="0%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="60%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#f9e2af" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f9e2af" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg-grad)"/>
  <rect width="1080" height="1080" fill="url(#mesh1)"/>
  <rect width="1080" height="1080" fill="url(#mesh2)"/>
  <rect width="1080" height="1080" fill="url(#mesh3)"/>
  <text x="540" y="400" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="52" font-weight="800" fill="#cdd6f4" opacity="0.95">{{ slide.title }}</text>
  {% if slide.subtitle %}
  <text x="540" y="460" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" fill="#a6adc8">{{ slide.subtitle }}</text>
  {% endif %}
  {% if slide.quote %}
  <text x="540" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" fill="#7f849c">
{% for line in quote_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}38{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not quote_lines %}<tspan x="540">{{ slide.quote }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>