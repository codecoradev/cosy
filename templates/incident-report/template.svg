<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  {% set is_sev1 = slide.severity == 'SEV1' or slide.severity == 'sev1' %}
  {% set is_sev2 = slide.severity == 'SEV2' or slide.severity == 'sev2' %}
  <rect x="100" y="120" width="200" height="50" rx="12" fill="{% if is_sev1 %}#f38ba8{% elif is_sev2 %}#f9e2af{% else %}#89b4fa{% endif %}" opacity="0.15"/>
  <text x="200" y="153" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="800" fill="{% if is_sev1 %}#f38ba8{% elif is_sev2 %}#f9e2af{% else %}#89b4fa{% endif %}">{{ slide.severity }}</text>
  {% set is_resolved = slide.status == 'resolved' or slide.status == 'Resolved' %}
  <rect x="320" y="120" width="200" height="50" rx="12" fill="{% if is_resolved %}#a6e3a1{% else %}#f9e2af{% endif %}" opacity="0.15"/>
  <text x="420" y="153" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="700" fill="{% if is_resolved %}#a6e3a1{% else %}#f9e2af{% endif %}">{{ slide.status | upper }}</text>
  <rect x="540" y="120" width="200" height="50" rx="12" fill="#313244" opacity="0.12"/>
  <text x="640" y="153" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="20" fill="#cdd6f4">{{ slide.duration }}</text>
  {% if slide.timestamp %}
  <text x="780" y="153" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">{{ slide.timestamp }}</text>
  {% endif %}
  <rect x="100" y="230" width="880" height="120" rx="16" fill="#313244" opacity="0.16"/>
  <text x="140" y="278" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Affected Services</text>
  <text x="140" y="322" font-family="Inter,sans-serif" font-size="26" fill="#f38ba8">{{ slide.affected }}</text>
  <rect x="100" y="420" width="880" height="500" rx="16" fill="#313244" opacity="0.08"/>
  <rect x="100" y="444" width="5" height="452" rx="2.5" fill="url(#acc-grad)" opacity="0.5"/>
  <text x="540" y="640" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" fill="#a6adc8">
{% for line in summary_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}48{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not summary_lines %}<tspan x="540">{{ slide.summary }}</tspan>{% endif %}
  </text>
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>