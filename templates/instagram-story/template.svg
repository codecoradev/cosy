<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
  </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1920" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1920" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  {% if slide.tag %}
  <rect x="80" y="160" width="300" height="60" rx="30" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="230" y="198" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.tag }}</text>
  {% endif %}
  <text x="540" y="860" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="64" font-weight="700" fill="#cdd6f4">
    {% for line in headline_lines %}<tspan x="540" dy="{% if loop.first %}0{% else %}80{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not headline_lines %}<tspan x="540" dy="0">{{ slide.headline }}</tspan>{% endif %}
  </text>
  {% if slide.subtext %}
  <text x="540" y="1150" text-anchor="middle" font-family="Inter,sans-serif" font-size="32" font-weight="400" fill="#a6adc8">
    {% for line in subtext_lines %}<tspan x="540" dy="{% if loop.first %}0{% else %}46{% endif %}">{{ line }}</tspan>{% endfor %}
  </text>
  {% endif %}
  <text x="540" y="1870" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }} · {{ brand.brand_handle | default('') }}</text>
  <circle cx="1000" cy="80" r="180" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1792" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>
