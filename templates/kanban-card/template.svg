<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="100" y="130" width="320" height="420" rx="12" fill="#f9e2af" opacity="0.04"/>
  <rect x="100" y="130" width="320" height="40" rx="12" fill="#f9e2af" opacity="0.08"/>
  <text x="260" y="158" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="700" fill="#f9e2af">TODO</text>
  {% set todo_items = [slide.todo1, slide.todo2] %}
  {% for item in todo_items %}
  {% if item %}
  {% set iy = 200 + loop.index0 * 60 %}
  <rect x="120" y="{{ iy - 25 }}" width="280" height="45" rx="6" fill="#313244" opacity="0.3"/>
  <text x="135" y="{{ iy }}" font-family="Inter,sans-serif" font-size="18" fill="#a6adc8">{{ item }}</text>
  {% endif %}
  {% endfor %}
  <rect x="440" y="130" width="320" height="420" rx="12" fill="url(#acc-grad)" opacity="0.04"/>
  <rect x="440" y="130" width="320" height="40" rx="12" fill="url(#acc-grad)" opacity="0.08"/>
  <text x="600" y="158" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="700" fill="url(#acc-grad)">DOING</text>
  {% set doing_items = [slide.doing1, slide.doing2] %}
  {% for item in doing_items %}
  {% if item %}
  {% set iy = 200 + loop.index0 * 60 %}
  <rect x="460" y="{{ iy - 25 }}" width="280" height="45" rx="6" fill="#313244" opacity="0.3"/>
  <text x="475" y="{{ iy }}" font-family="Inter,sans-serif" font-size="18" fill="#a6adc8">{{ item }}</text>
  {% endif %}
  {% endfor %}
  <rect x="780" y="130" width="320" height="420" rx="12" fill="#a6e3a1" opacity="0.04"/>
  <rect x="780" y="130" width="320" height="40" rx="12" fill="#a6e3a1" opacity="0.08"/>
  <text x="940" y="158" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="700" fill="#a6e3a1">DONE</text>
  {% set done_items = [slide.done1, slide.done2] %}
  {% for item in done_items %}
  {% if item %}
  {% set iy = 200 + loop.index0 * 60 %}
  <rect x="800" y="{{ iy - 25 }}" width="280" height="45" rx="6" fill="#313244" opacity="0.3"/>
  <text x="815" y="{{ iy }}" font-family="Inter,sans-serif" font-size="18" fill="#7f849c" text-decoration="line-through">{{ item }}</text>
  {% endif %}
  {% endfor %}
  <text x="600" y="605" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>