<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg-grad)"/>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <rect x="80" y="60" width="6" height="60" rx="3" fill="url(#acc-grad)"/>
  <text x="110" y="95" font-family="Inter,sans-serif" font-size="24" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ brand.brand_name | default('') }}</text>
  <text x="80" y="220" font-family="Inter,sans-serif" font-size="44" font-weight="700" fill="#cdd6f4">
    {% for line in headline_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}55{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not headline_lines %}<tspan x="80" dy="0">{{ slide.headline }}</tspan>{% endif %}
  </text>
  {% if slide.body %}
  <text x="80" y="420" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#a6adc8">
    {% for line in body_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
  </text>
  {% endif %}
  <text x="80" y="560" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="#bac2de">{{ slide.author | default('') }}{% if slide.role %} · {% endif %}{{ slide.role | default('') }}</text>
</svg>
