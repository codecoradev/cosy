<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="100" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <text x="540" y="880" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="500" fill="#7f849c">{{ slide.axis_x }}</text>
  <text x="80" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="500" fill="#7f849c" transform="rotate(-90 80 540)">{{ slide.axis_y }}</text>
  <line x1="540" y1="200" x2="540" y2="830" stroke="url(#acc-grad)" stroke-width="2" opacity="0.3"/>
  <line x1="160" y1="515" x2="920" y2="515" stroke="url(#acc-grad)" stroke-width="2" opacity="0.3"/>
  <rect x="160" y="200" width="380" height="315" rx="12" fill="#a6e3a1" opacity="0.06"/>
  <text x="350" y="260" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#a6e3a1">{{ slide.q1_label }}</text>
  {% if slide.q1_item %}<text x="350" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="#cdd6f4">{{ slide.q1_item }}</text>{% endif %}
  <rect x="540" y="200" width="380" height="315" rx="12" fill="url(#acc-grad)" opacity="0.06"/>
  <text x="730" y="260" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="url(#acc-grad)">{{ slide.q2_label }}</text>
  {% if slide.q2_item %}<text x="730" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="#cdd6f4">{{ slide.q2_item }}</text>{% endif %}
  <rect x="160" y="515" width="380" height="315" rx="12" fill="#7f849c" opacity="0.06"/>
  <text x="350" y="580" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#7f849c">{{ slide.q3_label }}</text>
  {% if slide.q3_item %}<text x="350" y="660" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="#cdd6f4">{{ slide.q3_item }}</text>{% endif %}
  <rect x="540" y="515" width="380" height="315" rx="12" fill="#f9e2af" opacity="0.06"/>
  <text x="730" y="580" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#f9e2af">{{ slide.q4_label }}</text>
  {% if slide.q4_item %}<text x="730" y="660" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="#cdd6f4">{{ slide.q4_item }}</text>{% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1030" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>