<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <text x="380" y="200" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#89b4fa">{{ slide.col1 }}</text>
  <text x="540" y="200" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#89b4fa">{{ slide.col2 }}</text>
  <text x="700" y="200" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#89b4fa">{{ slide.col3 }}</text>
  <line x1="100" y1="220" x2="980" y2="220" stroke="url(#acc-grad-h)" stroke-width="2" opacity="0.3"/>
  {% set rows = [(slide.r1_label, slide.r1c1, slide.r1c2, slide.r1c3), (slide.r2_label, slide.r2c1, slide.r2c2, slide.r2c3), (slide.r3_label, slide.r3c1, slide.r3c2, slide.r3c3)] %}
  {% for r in rows %}
  {% if r[0] %}
  <text x="180" y="{{ 300 + loop.index0 * 180 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="#cdd6f4">{{ r[0] }}</text>
  <rect x="290" y="{{ 260 + loop.index0 * 180 }}" width="140" height="80" rx="10" fill="#313244" opacity="0.12"/>
  <text x="360" y="{{ 310 + loop.index0 * 180 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ r[1] }}</text>
  <rect x="460" y="{{ 260 + loop.index0 * 180 }}" width="140" height="80" rx="10" fill="#313244" opacity="0.12"/>
  <text x="530" y="{{ 310 + loop.index0 * 180 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ r[2] }}</text>
  <rect x="630" y="{{ 260 + loop.index0 * 180 }}" width="140" height="80" rx="10" fill="#313244" opacity="0.12"/>
  <text x="700" y="{{ 310 + loop.index0 * 180 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ r[3] }}</text>
  {% endif %}
  {% endfor %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>