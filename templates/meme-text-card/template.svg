<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  </defs>

  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.55) }}"/>
  {% endif %}
  <g id="bg">
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}{{ brand.bg_overlay_opacity | default(0.5) }}{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  </g>

  {# Top caption: uppercase, wrapped, centered #}
  <g id="f-top_text" font-family="Inter,sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">
    {% set ns = namespace(y = 220) %}
    {% for line in top_text_lines %}
    <text x="540" y="{{ ns.y }}">{{ line | upper }}</text>
    {% set ns.y = ns.y + 86 %}
    {% endfor %}
  </g>

  {# Bottom caption #}
  <g id="f-bottom_text" font-family="Inter,sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">
    {% set n_lines = bottom_text_lines | length %}
    {% set ns = namespace(y = 1350 - 140 - (n_lines - 1) * 86) %}
    {% for line in bottom_text_lines %}
    <text x="540" y="{{ ns.y }}">{{ line | upper }}</text>
    {% set ns.y = ns.y + 86 %}
    {% endfor %}
  </g>

  {# Accent frame #}
  <g id="brand">
  <rect x="0" y="0" width="1080" height="10" fill="url(#acc-grad)"/>
  <rect x="0" y="1340" width="1080" height="10" fill="url(#acc-grad)"/>

  {% if brand.show_brand %}
  <text x="540" y="1290" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c" opacity="0.8">{{ brand.brand_name | default('') }}{% if brand.brand_handle %} · {{ brand.brand_handle }}{% endif %}</text>
  {% endif %}
  </g>
</svg>
