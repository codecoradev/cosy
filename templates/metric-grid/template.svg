<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <!-- Title -->
  {% if slide.title %}
  <text x="540" y="130" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}48{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>
  {% endif %}

  {% set metrics = [
    (slide.metric1_value, slide.metric1_label, metric1_label_lines),
    (slide.metric2_value, slide.metric2_label, metric2_label_lines),
    (slide.metric3_value, slide.metric3_label, metric3_label_lines),
    (slide.metric4_value, slide.metric4_label, metric4_label_lines)
  ] %}
  {% set positions = [(290, 380), (790, 380), (290, 750), (790, 750)] %}

  {% for metric in metrics %}
  {% set pos = positions[loop.index0] %}
  <!-- Metric box -->
  <rect x="{{ pos[0] - 200 }}" y="{{ pos[1] - 110 }}" width="400" height="220" rx="20" fill="#313244" opacity="0.4"/>
  <!-- Value -->
  <text x="{{ pos[0] }}" y="{{ pos[1] - 10 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="72" font-weight="900" fill="url(#acc-grad)">{{ metric[0] }}</text>
  <!-- Label -->
  {% if metric[2] %}
    {% for line in metric[2] %}
  <text x="{{ pos[0] }}" y="{{ pos[1] + 30 + loop.index0 * 28 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#a6adc8">{{ line }}</text>
    {% endfor %}
  {% else %}
  <text x="{{ pos[0] }}" y="{{ pos[1] + 30 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#a6adc8">{{ metric[1] }}</text>
  {% endif %}
  {% endfor %}
  <text x="540" y="1000" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1012" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>