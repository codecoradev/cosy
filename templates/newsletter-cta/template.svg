<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="320" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="56" font-weight="800" fill="#cdd6f4">
{% for line in headline_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}68{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not headline_lines %}<tspan x="540">{{ slide.headline }}</tspan>{% endif %}
  </text>
  {% set hl_n = 1 %}{% if headline_lines %}{% set hl_n = headline_lines|length %}{% endif %}
  {% set value_y = 320 + (hl_n - 1) * 68 + 90 %}
  {% if slide.value %}
  <text x="540" y="{{ value_y }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="400" fill="#a6adc8">
{% for line in value_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}36{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not value_lines %}<tspan x="540">{{ slide.value }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% set vl_n = 1 %}{% if value_lines %}{% set vl_n = value_lines|length %}{% endif %}
  {% set input_y = value_y + (vl_n - 1) * 36 + 100 %}
  <rect x="290" y="{{ input_y }}" width="500" height="60" rx="30" fill="#313244" opacity="0.6"/>
  <text x="320" y="{{ input_y + 38 }}" font-family="JetBrains Mono,monospace" font-size="22" font-weight="400" fill="#7f849c">you@example.com</text>
  <rect x="650" y="{{ input_y + 8 }}" width="120" height="44" rx="20" fill="url(#acc-grad)"/>
  <text x="710" y="{{ input_y + 36 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#1e1e2e">Subscribe</text>
  {% if slide.subscriber_count %}
  <text x="540" y="{{ input_y + 150 }}" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="url(#acc-grad)">{{ slide.subscriber_count }} subscribers{% if slide.frequency %} &#xB7; {{ slide.frequency }}{% endif %}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>