<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  {% if slide.issue_number %}
  <text x="80" y="80" font-family="JetBrains Mono,monospace" font-size="22" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.issue_number }}</text>
  {% endif %}
  <text x="80" y="210" font-family="Inter,sans-serif" font-size="42" font-weight="700" fill="#cdd6f4">
    {% for line in title_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}52{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="80" dy="0">{{ slide.title }}</tspan>{% endif %}
  </text>
  <text x="1120" y="360" text-anchor="end" font-family="Inter,sans-serif" font-size="20" font-weight="400" fill="#7f849c">{{ slide.date | default('') }}</text>
</svg>
