<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="100" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="100" y="180" width="880" height="120" rx="20" fill="#0c0c14" opacity="0.85"/>
  <text x="540" y="258" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="36" fill="#a6e3a1">{{ slide.password }}</text>
  {% set is_strong = slide.strength == 'strong' or slide.strength == 'Strong' %}
  {% set is_medium = slide.strength == 'medium' or slide.strength == 'Medium' %}
  <rect x="100" y="360" width="880" height="50" rx="30" fill="#313244" opacity="0.2"/>
  <rect x="100" y="360" width="{{ (slide.length | int) * 880 / 64 }}" height="50" rx="30" fill="{% if is_strong %}#a6e3a1{% elif is_medium %}#f9e2af{% else %}#f38ba8{% endif %}" opacity="0.4"/>
  <text x="540" y="393" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="{% if is_strong %}#a6e3a1{% elif is_medium %}#f9e2af{% else %}#f38ba8{% endif %}">{{ slide.strength | upper }}</text>
  <rect x="100" y="500" width="280" height="120" rx="12" fill="#313244" opacity="0.12"/>
  <text x="240" y="550" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Length</text>
  <text x="240" y="595" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="42" font-weight="800" fill="url(#acc-grad)">{{ slide.length }}</text>
  {% if slide.entropy %}
  <rect x="400" y="500" width="280" height="120" rx="12" fill="#313244" opacity="0.12"/>
  <text x="540" y="550" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Entropy</text>
  <text x="540" y="595" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="42" font-weight="800" fill="url(#acc-grad)">{{ slide.entropy }}</text>
  {% endif %}
  {% if slide.crack_time %}
  <rect x="700" y="500" width="280" height="120" rx="12" fill="#313244" opacity="0.12"/>
  <text x="840" y="550" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Crack Time</text>
  <text x="840" y="590" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#a6e3a1">{{ slide.crack_time }}</text>
  {% endif %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>