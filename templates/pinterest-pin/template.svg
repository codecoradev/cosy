<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1000" height="1500" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1000" height="1500" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1000" height="1500" fill="url(#glow)"/>
  <rect width="1000" height="1500" fill="url(#dots)"/>
  <!-- Category badge -->
  {% if slide.category %}
  <rect x="350" y="180" width="300" height="50" rx="25" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="500" y="212" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="url(#acc-grad)">{{ slide.category }}</text>
  {% endif %}

  <!-- Title -->
  <text x="500" y="550" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="64" font-weight="800" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="500" dy="{% if loop.first %}0{% else %}76{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="500">{{ slide.title }}</tspan>{% endif %}
  </text>

  <!-- Accent line -->
  <rect x="400" y="800" width="200" height="4" rx="2" fill="url(#acc-grad-h)"/>

  <!-- Subtitle -->
  {% if slide.subtitle %}
  <text x="500" y="890" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="400" fill="#a6adc8">
{% for line in subtitle_lines %}    <tspan x="500" dy="{% if loop.first %}0{% else %}38{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not subtitle_lines %}<tspan x="500">{{ slide.subtitle }}</tspan>{% endif %}
  </text>
  {% endif %}

  <circle cx="850" cy="300" r="200" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.05"/>
  <text x="500" y="1400" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="872" y="1432" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>