<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect x="390" y="180" width="300" height="80" rx="30" fill="url(#acc-grad)" opacity="0.12"/>
  <text x="540" y="232" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="28" font-weight="700" fill="url(#acc-grad)">EP {{ slide.episode_number }}</text>
  <text x="540" y="380" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="44" font-weight="700" fill="#cdd6f4">
{% for line in episode_title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}54{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not episode_title_lines %}<tspan x="540">{{ slide.episode_title }}</tspan>{% endif %}
  </text>
  {% if slide.guest %}
  <rect x="440" y="560" width="200" height="2" fill="url(#acc-grad-h)" opacity="0.3"/>
  <text x="540" y="615" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="600" fill="#7f849c">with</text>
  <text x="540" y="660" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="30" font-weight="700" fill="url(#acc-grad)">{{ slide.guest }}</text>
  {% endif %}
  {% if slide.topic %}
  <rect x="390" y="710" width="300" height="44" rx="20" fill="#313244" opacity="0.4"/>
  <text x="540" y="739" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="#a6adc8">{{ slide.topic }}</text>
  {% endif %}
  {% if slide.duration %}
  <text x="540" y="830" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ slide.duration }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1040" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>