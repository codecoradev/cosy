<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <!-- Question -->
  <text x="540" y="160" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="42" font-weight="700" fill="#cdd6f4">
{% for line in question_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}52{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not question_lines %}<tspan x="540">{{ slide.question }}</tspan>{% endif %}
  </text>

  <!-- Options with bars -->
{% set options = [
  (slide.option_a, slide.option_a_pct),
  (slide.option_b, slide.option_b_pct),
  (slide.option_c, slide.option_c_pct),
  (slide.option_d, slide.option_d_pct)
] %}
{% for opt in options %}
{% if opt[0] %}
  {% set row = loop.index0 %}
  {% set y_row = 320 + row * 150 %}
  <!-- Option label -->
  <text x="140" y="{{ y_row - 10 }}" font-family="Inter,sans-serif" font-size="26" font-weight="600" fill="#cdd6f4">{{ opt[0] }}</text>
  <!-- Percentage -->
  <text x="940" y="{{ y_row - 10 }}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="30" font-weight="700" fill="url(#acc-grad)">{{ opt[1] }}</text>
  <!-- Bar background -->
  <rect x="140" y="{{ y_row + 10 }}" width="800" height="16" rx="12" fill="#313244"/>
  <!-- Bar fill (full width for demo) -->
  <rect x="140" y="{{ y_row + 10 }}" width="800" height="16" rx="12" fill="url(#acc-grad-h)" opacity="0.7"/>
{% endif %}
{% endfor %}

  <!-- Total votes -->
  {% if slide.total_votes %}
  <text x="540" y="960" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#7f849c">{{ slide.total_votes }} votes</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1000" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1012" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>