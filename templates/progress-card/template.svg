<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <!-- Title -->
  <text x="540" y="250" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}58{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>

  <!-- Big percentage -->
  <text x="540" y="500" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="180" font-weight="900" fill="url(#acc-grad)">{{ slide.percentage }}</text>

  <!-- Progress bar background -->
  <rect x="140" y="580" width="800" height="24" rx="12" fill="#313244"/>
  <!-- Progress bar fill -->
  <rect x="140" y="580" width="800" height="24" rx="12" fill="url(#acc-grad-h)"/>

  <!-- Milestone label -->
  {% if slide.milestone_label %}
  <text x="540" y="670" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="500" fill="#a6adc8">
{% for line in milestone_label_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}38{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not milestone_label_lines %}<tspan x="540">{{ slide.milestone_label }}</tspan>{% endif %}
  </text>
  {% endif %}

  <!-- Items counter -->
  {% if slide.items_done and slide.items_total %}
  <text x="540" y="760" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="24" font-weight="500" fill="#7f849c">{{ slide.items_done }} / {{ slide.items_total }} completed</text>
  {% endif %}

  <circle cx="950" cy="120" r="160" fill="{{ brand.accent_color | default('#cba6f7') }}" opacity="0.04"/>
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1012" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>