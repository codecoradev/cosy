<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="100" y="100" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="600" fill="#7f849c">Pull Request {{ slide.pr_number }}</text>
  <text x="100" y="170" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">
{% for line in pr_title_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}46{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not pr_title_lines %}<tspan x="100">{{ slide.pr_title }}</tspan>{% endif %}
  </text>
  <rect x="100" y="310" width="140" height="40" rx="20" fill="#cba6f7" opacity="0.12"/>
  <text x="170" y="336" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="#cba6f7">{{ slide.author }}</text>
  <text x="100" y="400" font-family="JetBrains Mono,monospace" font-size="20" fill="#89b4fa">{{ slide.branch }}</text>
  <text x="380" y="400" font-family="Inter,sans-serif" font-size="24" fill="#7f849c">-></text>
  <text x="440" y="400" font-family="JetBrains Mono,monospace" font-size="20" fill="#a6e3a1">{{ slide.base_branch }}</text>
  {% set is_merged = slide.status == 'Merged' or slide.status == 'MERGED' %}
  {% set is_open = slide.status == 'Open' or slide.status == 'OPEN' %}
  <rect x="100" y="460" width="160" height="44" rx="20" fill="{% if is_merged %}#cba6f7{% elif is_open %}#a6e3a1{% else %}#f38ba8{% endif %}" opacity="0.15"/>
  <text x="180" y="488" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="{% if is_merged %}#cba6f7{% elif is_open %}#a6e3a1{% else %}#f38ba8{% endif %}">{{ slide.status }}</text>
  {% if slide.additions %}
  <text x="350" y="488" font-family="JetBrains Mono,monospace" font-size="20" fill="#a6e3a1">+{{ slide.additions }}</text>
  <text x="480" y="488" font-family="JetBrains Mono,monospace" font-size="20" fill="#f38ba8">-{{ slide.deletions }}</text>
  {% endif %}
  <text x="600" y="615" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>