<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect x="240" y="140" width="600" height="800" rx="20" fill="#313244" opacity="0.3"/>
  <text x="540" y="260" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="44" font-weight="800" fill="#cdd6f4">{{ slide.name }}</text>
  <text x="540" y="310" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="url(#acc-grad)">{{ slide.title }}</text>
  <rect x="440" y="370" width="200" height="3" rx="1.5" fill="url(#acc-grad-h)" opacity="0.4"/>
  <rect x="390" y="420" width="300" height="300" rx="20" fill="#1e1e2e" opacity="0.6"/>
  <rect x="430" y="460" width="220" height="220" rx="12" fill="none" stroke="url(#acc-grad)" stroke-width="2" opacity="0.2"/>
  <text x="540" y="580" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="120" fill="url(#acc-grad)" opacity="0.15">QR</text>
  <text x="540" y="625" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Scan to connect</text>
  {% if slide.email %}
  <text x="540" y="780" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#a6adc8">{{ slide.email }}</text>
  {% endif %}
  {% if slide.website %}
  <text x="540" y="815" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#a6adc8">{{ slide.website }}</text>
  {% endif %}
  {% if slide.phone %}
  <text x="540" y="850" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#a6adc8">{{ slide.phone }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>