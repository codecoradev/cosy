<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  {% if slide.title %}
  <text x="540" y="100" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  {% endif %}
  {% set items = [
    (slide.q1_text, slide.q1_author, q1_text_lines),
    (slide.q2_text, slide.q2_author, q2_text_lines),
    (slide.q3_text, slide.q3_author, q3_text_lines)
  ] %}
  {% for q in items %}
  {% if q[0] %}
  {% set cy = 200 + loop.index0 * 370 %}
  <rect x="160" y="{{ cy - 80 }}" width="760" height="340" rx="20" fill="#313244" opacity="0.25"/>
  <text x="220" y="{{ cy + 20 }}" font-size="60" fill="url(#acc-grad)" opacity="0.3">&#x26;</text>
  {% set ql = q[2] %}
  {% if ql %}
    {% for line in ql %}
  <text x="220" y="{{ cy + 30 + loop.index0 * 38 }}" font-family="Inter,sans-serif" font-size="24" font-weight="500" fill="#cdd6f4">{{ line }}</text>
    {% endfor %}
  {% else %}
  <text x="220" y="{{ cy + 30 }}" font-family="Inter,sans-serif" font-size="24" font-weight="500" fill="#cdd6f4">{{ q[0] }}</text>
  {% endif %}
  <rect x="220" y="{{ cy + 180 }}" width="80" height="2" fill="url(#acc-grad-h)"/>
  <text x="220" y="{{ cy + 210 }}" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="url(#acc-grad)">{{ q[1] }}</text>
  {% endif %}
  {% endfor %}
  <text x="540" y="1300" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>