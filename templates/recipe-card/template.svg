<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <text x="540" y="120" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="700" fill="#cdd6f4">
{% for line in recipe_name_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}50{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not recipe_name_lines %}<tspan x="540">{{ slide.recipe_name }}</tspan>{% endif %}
  </text>
  {% if slide.servings or slide.time %}
  <rect x="290" y="220" width="500" height="44" rx="20" fill="url(#acc-grad)" opacity="0.08"/>
  {% if slide.servings %}<text x="380" y="248" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="url(#acc-grad)">{{ slide.servings }}</text>{% endif %}
  {% if slide.servings and slide.time %}<text x="500" y="248" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="#45475a">|</text>{% endif %}
  {% if slide.time %}<text x="600" y="248" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="url(#acc-grad)">{{ slide.time }}</text>{% endif %}
  {% endif %}
  <text x="120" y="340" font-family="Space Grotesk,sans-serif" font-size="26" font-weight="700" fill="url(#acc-grad)">Ingredients</text>
  <rect x="120" y="355" width="120" height="2" fill="url(#acc-grad-h)" opacity="0.3"/>
  <text x="120" y="400" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#a6adc8">
{% for line in ingredients_lines %}    <tspan x="120" dy="{% if loop.first %}0{% else %}32{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not ingredients_lines %}<tspan x="120">{{ slide.ingredients }}</tspan>{% endif %}
  </text>
  {% set steps = [slide.step1, slide.step2, slide.step3] %}
  {% for step in steps %}
  {% if step %}
  {% set sy = 730 + loop.index0 * 180 %}
  <circle cx="150" cy="{{ sy }}" r="24" fill="url(#acc-grad)" opacity="0.12"/>
  <text x="150" y="{{ sy + 8 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="800" fill="url(#acc-grad)">{{ loop.index }}</text>
  <text x="195" y="{{ sy - 5 }}" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#cdd6f4">{{ step }}</text>
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1310" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>