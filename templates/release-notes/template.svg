<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <rect x="160" y="100" width="760" height="110" rx="20" fill="url(#acc-grad)" opacity="0.08"/>
  <text x="240" y="150" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="url(#acc-grad)">v{{ slide.version }}</text>
  <text x="240" y="190" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ slide.date }}</text>
  <text x="840" y="165" text-anchor="end" font-size="48" opacity="0.1" fill="url(#acc-grad)">&#x1F680;</text>
  <text x="200" y="310" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="#a6e3a1">New Features</text>
  <rect x="200" y="325" width="100" height="2" fill="#a6e3a1" opacity="0.3"/>
  {% set new_items = [slide.new1, slide.new2, slide.new3] %}
  {% for item in new_items %}
  {% if item %}
  <text x="210" y="{{ 370 + loop.index0 * 45 }}" font-family="Inter,sans-serif" font-size="22" fill="#a6e3a1">+</text>
  <text x="240" y="{{ 370 + loop.index0 * 45 }}" font-family="Inter,sans-serif" font-size="22" fill="#cdd6f4">{{ item }}</text>
  {% endif %}
  {% endfor %}
  <text x="200" y="560" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="#f38ba8">Bug Fixes</text>
  <rect x="200" y="575" width="100" height="2" fill="#f38ba8" opacity="0.3"/>
  {% set fix_items = [slide.fix1, slide.fix2] %}
  {% for item in fix_items %}
  {% if item %}
  <text x="210" y="{{ 620 + loop.index0 * 45 }}" font-family="Inter,sans-serif" font-size="22" fill="#f38ba8">-</text>
  <text x="240" y="{{ 620 + loop.index0 * 45 }}" font-family="Inter,sans-serif" font-size="22" fill="#a6adc8">{{ item }}</text>
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1320" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>