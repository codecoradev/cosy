<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="600" height="600" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="600" height="600" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="600" height="600" fill="url(#glow)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="300" r="240" fill="none" stroke="url(#acc-grad)" stroke-width="3" opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="300" cy="300" r="210" fill="url(#acc-grad)" opacity="0.08"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="url(#acc-grad)" stroke-width="4" opacity="0.4"/>
  <text x="300" y="200" text-anchor="middle" font-size="40" fill="url(#acc-grad)" opacity="0.6">&#x2B50;</text>
  <text x="300" y="310" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="56" font-weight="900" fill="#cdd6f4">{{ slide.main_text }}</text>
  {% if slide.sub_text %}
  <text x="300" y="370" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="600" fill="url(#acc-grad)">
{% for line in sub_text_lines %}    <tspan x="300" dy="{% if loop.first %}0{% else %}30{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not sub_text_lines %}<tspan x="300">{{ slide.sub_text }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% if slide.year %}
  <rect x="230" y="420" width="140" height="40" rx="20" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="300" y="447" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="20" font-weight="700" fill="url(#acc-grad)">{{ slide.year }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="300" y="555" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>