<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="180" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="700" fill="#cdd6f4">{{ slide.product_name }}</text>
  <text x="540" y="320" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="90" font-weight="900" fill="url(#acc-grad)">{{ slide.rating }}</text>
  <text x="700" y="320" text-anchor="start" font-family="Inter,sans-serif" font-size="36" font-weight="500" fill="#7f849c">/{{ slide.max_rating | default('5') }}</text>
  <rect x="440" y="370" width="200" height="3" rx="1.5" fill="url(#acc-grad-h)"/>
  <text x="540" y="480" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="400" fill="#a6adc8">
{% for line in review_text_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}38{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not review_text_lines %}<tspan x="540">{{ slide.review_text }}</tspan>{% endif %}
  </text>
  <circle cx="420" cy="800" r="32" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="420" y="810" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ slide.reviewer[:1] | upper }}</text>
  <text x="470" y="795" font-family="Inter,sans-serif" font-size="24" font-weight="600" fill="#cdd6f4">{{ slide.reviewer }}</text>
  {% if slide.source %}
  <text x="470" y="825" font-family="Inter,sans-serif" font-size="18" font-weight="400" fill="#7f849c">{{ slide.source }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>