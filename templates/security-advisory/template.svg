<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  {% set is_critical = slide.severity == 'critical' or slide.severity == 'CRITICAL' %}
  {% set is_high = slide.severity == 'high' or slide.severity == 'HIGH' %}
  <rect x="0" y="0" width="1200" height="6" fill="{% if is_critical %}#f38ba8{% elif is_high %}#fab387{% else %}#f9e2af{% endif %}"/>
  <text x="600" y="70" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="26" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="940" y="45" width="160" height="40" rx="20" fill="{% if is_critical %}#f38ba8{% elif is_high %}#fab387{% else %}#f9e2af{% endif %}" opacity="0.2"/>
  <text x="1020" y="71" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="{% if is_critical %}#f38ba8{% elif is_high %}#fab387{% else %}#f9e2af{% endif %}">{{ slide.severity | upper }}</text>
  <rect x="80" y="120" width="280" height="50" rx="12" fill="#313244" opacity="0.2"/>
  <text x="100" y="152" font-family="JetBrains Mono,monospace" font-size="22" font-weight="600" fill="#89b4fa">{{ slide.cve }}</text>
  <rect x="380" y="120" width="280" height="50" rx="12" fill="#313244" opacity="0.2"/>
  <text x="400" y="152" font-family="Inter,sans-serif" font-size="18" fill="#f38ba8">Affected: {{ slide.affected }}</text>
  <text x="100" y="260" font-family="Inter,sans-serif" font-size="24" fill="#cdd6f4">
{% for line in description_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="100">{{ slide.description }}</tspan>{% endif %}
  </text>
  {% if slide.fix_version %}
  <rect x="80" y="510" width="280" height="50" rx="12" fill="#a6e3a1" opacity="0.1"/>
  <text x="100" y="542" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#a6e3a1">Fixed in v{{ slide.fix_version }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="600" y="615" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>