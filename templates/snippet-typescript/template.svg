<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="80" y="80" width="1040" height="500" rx="12" fill="#0c0c14" opacity="0.85"/>
  <rect x="80" y="80" width="1040" height="36" rx="12" fill="#313244" opacity="0.4"/>
  <circle cx="105" cy="98" r="5" fill="#f38ba8" opacity="0.6"/>
  <circle cx="120" cy="98" r="5" fill="#f9e2af" opacity="0.6"/>
  <circle cx="135" cy="98" r="5" fill="#a6e3a1" opacity="0.6"/>
  <text x="170" y="103" font-family="JetBrains Mono,monospace" font-size="14" fill="#7f849c">{{ slide.filename }}</text>
  <text x="120" y="170" font-family="JetBrains Mono,monospace" font-size="18" fill="#cba6f7">{{ slide.line1 }}</text>
  {% if slide.line2 %}<text x="120" y="215" font-family="JetBrains Mono,monospace" font-size="18" fill="#89b4fa">{{ slide.line2 }}</text>{% endif %}
  {% if slide.line3 %}<text x="120" y="260" font-family="JetBrains Mono,monospace" font-size="18" fill="#cdd6f4">{{ slide.line3 }}</text>{% endif %}
  {% if slide.line4 %}<text x="120" y="305" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6e3a1">{{ slide.line4 }}</text>{% endif %}
  {% if slide.line5 %}<text x="120" y="350" font-family="JetBrains Mono,monospace" font-size="18" fill="#cdd6f4">{{ slide.line5 }}</text>{% endif %}
  {% if slide.line6 %}<text x="120" y="395" font-family="JetBrains Mono,monospace" font-size="18" fill="#f9e2af">{{ slide.line6 }}</text>{% endif %}
  {% if brand.show_brand %}
  <text x="600" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>