<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <circle cx="540" cy="280" r="100" fill="url(#acc-grad)" opacity="0.12"/>
  <text x="540" y="300" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="60" font-weight="800" fill="url(#acc-grad)">{{ slide.sponsor_name[:1] }}</text>
  <text x="540" y="440" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">{{ slide.sponsor_name }}</text>
  <rect x="390" y="480" width="300" height="56" rx="30" fill="url(#acc-grad)" opacity="0.12"/>
  <text x="540" y="517" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="url(#acc-grad)">{{ slide.tier }} Sponsor</text>
  <rect x="340" y="580" width="400" height="100" rx="20" fill="#313244" opacity="0.12"/>
  <text x="540" y="625" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Monthly Contribution</text>
  <text x="540" y="660" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="800" fill="#a6e3a1">{{ slide.amount }}</text>
  {% if slide.message %}
  <text x="540" y="760" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" fill="#a6adc8">
{% for line in message_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}32{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not message_lines %}<tspan x="540">{{ slide.message }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% if slide.since %}
  <text x="540" y="900" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Sponsoring since {{ slide.since }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>