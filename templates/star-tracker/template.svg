<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="100" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="24" fill="#89b4fa">{{ slide.repo }}</text>
  <text x="540" y="280" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="120" font-weight="800" fill="url(#acc-grad)">{{ slide.current_stars }}</text>
  <text x="540" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" fill="#7f849c">GitHub Stars</text>
  {% set progress = (slide.current_stars | int) * 100 / (slide.goal_stars | int) %}
  <rect x="200" y="440" width="680" height="20" rx="12" fill="#313244" opacity="0.3"/>
  <rect x="200" y="440" width="{{ progress * 680 / 100 }}" height="20" rx="12" fill="url(#acc-grad-h)"/>
  <text x="200" y="500" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">{{ slide.current_stars }}</text>
  <text x="880" y="500" text-anchor="end" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">{{ slide.goal_stars }}</text>
  {% if slide.milestone %}
  <text x="540" y="560" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="500" fill="#cdd6f4">{{ slide.milestone }}</text>
  {% endif %}
  <rect x="280" y="660" width="220" height="80" rx="12" fill="#313244" opacity="0.15"/>
  <text x="390" y="700" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="800" fill="url(#acc-grad)">{{ slide.forks | default('0') }}</text>
  <text x="390" y="725" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Forks</text>
  <rect x="580" y="660" width="220" height="80" rx="12" fill="#313244" opacity="0.15"/>
  <text x="690" y="700" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="36" font-weight="800" fill="url(#acc-grad)">{{ slide.watchers | default('0') }}</text>
  <text x="690" y="725" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Watchers</text>
  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>