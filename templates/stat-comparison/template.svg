<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="130" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}50{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>
  <rect x="140" y="280" width="360" height="380" rx="20" fill="#313244" opacity="0.3"/>
  <text x="320" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="500" fill="#7f849c">{{ slide.before_label }}</text>
  <text x="320" y="500" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="72" font-weight="700" fill="#7f849c">{{ slide.before_value }}</text>
  <rect x="580" y="280" width="360" height="380" rx="20" fill="url(#acc-grad)" opacity="0.1"/>
  <rect x="580" y="280" width="360" height="380" rx="20" fill="none" stroke="url(#acc-grad)" stroke-width="2" opacity="0.3"/>
  <text x="760" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="url(#acc-grad)">{{ slide.after_label }}</text>
  <text x="760" y="500" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="72" font-weight="800" fill="url(#acc-grad)">{{ slide.after_value }}</text>
  <rect x="440" y="720" width="200" height="56" rx="30" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="540" y="757" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700" fill="url(#acc-grad)">{{ slide.improvement }}</text>
  {% if slide.metric %}
  <text x="540" y="850" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ slide.metric }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1000" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>