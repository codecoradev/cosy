<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  {% set is_operational = slide.status == 'operational' or slide.status == 'Operational' %}
  {% set is_degraded = slide.status == 'degraded' or slide.status == 'Degraded' %}
  <rect x="100" y="80" width="1000" height="470" rx="20" fill="#313244" opacity="0.08"/>
  <text x="600" y="160" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" fill="#7f849c">{{ slide.service }}</text>
  <circle cx="600" cy="280" r="70" fill="{% if is_operational %}#a6e3a1{% elif is_degraded %}#f9e2af{% else %}#f38ba8{% endif %}" opacity="0.15"/>
  <circle cx="600" cy="280" r="40" fill="{% if is_operational %}#a6e3a1{% elif is_degraded %}#f9e2af{% else %}#f38ba8{% endif %}" opacity="0.3"/>
  <text x="600" y="300" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="800" fill="{% if is_operational %}#a6e3a1{% elif is_degraded %}#f9e2af{% else %}#f38ba8{% endif %}">{{ slide.status | upper }}</text>
  {% if slide.uptime %}
  <text x="350" y="440" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Uptime</text>
  <text x="350" y="480" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="url(#acc-grad)">{{ slide.uptime }}</text>
  {% endif %}
  {% if slide.response_time %}
  <text x="600" y="440" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Response</text>
  <text x="600" y="480" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="url(#acc-grad)">{{ slide.response_time }}</text>
  {% endif %}
  {% if slide.last_incident %}
  <text x="850" y="440" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Last Incident</text>
  <text x="850" y="480" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="600" fill="#cdd6f4">{{ slide.last_incident }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="600" y="615" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>