<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <!-- Title -->
  <text x="540" y="160" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="44" font-weight="700" fill="#cdd6f4">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}54{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>

  <!-- Steps row 1 (steps 1-2) -->
  {% set steps = [
    (slide.step1_title, slide.step1_desc),
    (slide.step2_title, slide.step2_desc),
    (slide.step3_title, slide.step3_desc),
    (slide.step4_title, slide.step4_desc)
  ] %}
  {% set step_lines_arr = [step1_desc_lines, step2_desc_lines, step3_desc_lines, step4_desc_lines] %}

  {% for step in steps %}
  {% if step[0] %}
  {% set num = loop.index %}
  {% set col = (num - 1) % 2 %}
  {% set row = (num - 1) // 2 %}
  {% set x_center = 280 + col * 520 %}
  {% set y_center = 460 + row * 330 %}
  <!-- Step box -->
  <rect x="{{ x_center - 220 }}" y="{{ y_center - 110 }}" width="440" height="220" rx="20" fill="#313244" opacity="0.5"/>
  <!-- Step number badge -->
  <circle cx="{{ x_center - 180 }}" cy="{{ y_center - 60 }}" r="34" fill="url(#acc-grad)" opacity="0.2"/>
  <text x="{{ x_center - 180 }}" y="{{ y_center - 48 }}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="28" font-weight="800" fill="url(#acc-grad)">{{ num }}</text>
  <!-- Step title -->
  <text x="{{ x_center - 128 }}" y="{{ y_center - 50 }}" font-family="Inter,sans-serif" font-size="26" font-weight="700" fill="#cdd6f4">{{ step[0] }}</text>
  <!-- Step desc -->
  {% set desc_lines = step_lines_arr[num - 1] %}
  {% if desc_lines %}
    {% for line in desc_lines %}
  <text x="{{ x_center - 180 }}" y="{{ y_center + 15 + loop.index0 * 34 }}" font-family="Inter,sans-serif" font-size="19" font-weight="400" fill="#a6adc8">{{ line }}</text>
    {% endfor %}
  {% elif step[1] %}
  <text x="{{ x_center - 180 }}" y="{{ y_center + 15 }}" font-family="Inter,sans-serif" font-size="19" font-weight="400" fill="#a6adc8">{{ step[1] }}</text>
  {% endif %}
  {% endif %}
  {% endfor %}

  {% if brand.show_brand %}
  <text x="540" y="1050" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1012" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>