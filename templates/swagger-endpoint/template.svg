<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  {% set is_get = slide.method == 'GET' %}
  {% set is_post = slide.method == 'POST' %}
  {% set is_put = slide.method == 'PUT' %}
  {% set is_del = slide.method == 'DELETE' %}
  <rect x="80" y="90" width="120" height="50" rx="12" fill="{% if is_get %}#a6e3a1{% elif is_post %}#f9e2af{% elif is_put %}#89b4fa{% else %}#f38ba8{% endif %}" opacity="0.15"/>
  <text x="140" y="123" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="22" font-weight="700" fill="{% if is_get %}#a6e3a1{% elif is_post %}#f9e2af{% elif is_put %}#89b4fa{% else %}#f38ba8{% endif %}">{{ slide.method }}</text>
  <text x="230" y="123" font-family="JetBrains Mono,monospace" font-size="22" fill="#cdd6f4">{{ slide.path }}</text>
  {% if slide.auth %}
  <rect x="960" y="95" width="140" height="40" rx="20" fill="#cba6f7" opacity="0.12"/>
  <text x="1030" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="#cba6f7">{{ slide.auth }}</text>
  {% endif %}
  <text x="100" y="220" font-family="Inter,sans-serif" font-size="24" fill="#a6adc8">
{% for line in description_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}34{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="100">{{ slide.description }}</tspan>{% endif %}
  </text>
  <rect x="80" y="430" width="1040" height="80" rx="12" fill="#313244" opacity="0.12"/>
  <text x="120" y="465" font-family="Inter,sans-serif" font-size="16" fill="#7f849c">Response</text>
  <text x="120" y="494" font-family="JetBrains Mono,monospace" font-size="22" font-weight="700" fill="#a6e3a1">{{ slide.response_code }}</text>
  <text x="220" y="494" font-family="Inter,sans-serif" font-size="22" fill="#cdd6f4">{{ slide.response_desc }}</text>
  <text x="600" y="615" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>