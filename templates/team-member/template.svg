<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="540" cy="320" r="120" fill="url(#acc-grad)" opacity="0.12"/>
  <circle cx="540" cy="320" r="110" fill="#313244" opacity="0.4"/>
  <text x="540" y="355" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="80" font-weight="800" fill="url(#acc-grad)">{{ slide.name[:2] | upper }}</text>
  <text x="540" y="520" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="44" font-weight="700" fill="#cdd6f4">{{ slide.name }}</text>
  <text x="540" y="570" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="url(#acc-grad)">{{ slide.role }}</text>
  <rect x="440" y="610" width="200" height="2" fill="url(#acc-grad-h)" opacity="0.3"/>
  {% if slide.bio %}
  <text x="540" y="680" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#a6adc8">
{% for line in bio_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}36{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not bio_lines %}<tspan x="540">{{ slide.bio }}</tspan>{% endif %}
  </text>
  {% endif %}
  {% if slide.location %}
  <text x="540" y="860" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ slide.location }}</text>
  {% endif %}
  {% if brand.show_brand %}
  <text x="540" y="1040" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>