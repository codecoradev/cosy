<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="80" y="80" width="1040" height="480" rx="12" fill="#0c0c14" opacity="0.9"/>
  <rect x="80" y="80" width="1040" height="40" rx="12" fill="#313244" opacity="0.5"/>
  <circle cx="110" cy="100" r="6" fill="#f38ba8" opacity="0.7"/>
  <circle cx="130" cy="100" r="6" fill="#f9e2af" opacity="0.7"/>
  <circle cx="150" cy="100" r="6" fill="#a6e3a1" opacity="0.7"/>
  <text x="120" y="170" font-family="JetBrains Mono,monospace" font-size="22" fill="#a6e3a1">{{ slide.user }}<tspan fill="#7f849c">@</tspan><tspan fill="#89b4fa">{{ slide.host }}</tspan><tspan fill="#7f849c">:</tspan><tspan fill="#cba6f7">{{ slide.path }}</tspan><tspan fill="#7f849c">$</tspan></text>
  <text x="120" y="210" font-family="JetBrains Mono,monospace" font-size="22" fill="#cdd6f4">{{ slide.command }}</text>
  {% if slide.output1 %}
  <text x="120" y="270" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6adc8">{{ slide.output1 }}</text>
  {% endif %}
  {% if slide.output2 %}
  <text x="120" y="310" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6adc8">{{ slide.output2 }}</text>
  {% endif %}
  {% if slide.output3 %}
  <text x="120" y="350" font-family="JetBrains Mono,monospace" font-size="18" fill="#a6adc8">{{ slide.output3 }}</text>
  {% endif %}
  <text x="120" y="430" font-family="JetBrains Mono,monospace" font-size="22" fill="#a6e3a1">{{ slide.user }}<tspan fill="#7f849c">@</tspan><tspan fill="#89b4fa">{{ slide.host }}</tspan><tspan fill="#7f849c">:</tspan><tspan fill="#cba6f7">{{ slide.path }}</tspan><tspan fill="#7f849c">$</tspan></text>
  <rect x="115" y="415" width="14" height="24" fill="#cdd6f4" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1s" repeatCount="indefinite"/>
  </rect>
  {% if brand.show_brand %}
  <text x="600" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>