<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="20%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <g id="bg">
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}{{ brand.bg_overlay_opacity | default(0.7) }}{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  </g>

  {# Quote mark (typographic, accent) #}
  <text x="120" y="290" font-family="Georgia,serif" font-size="180" fill="url(#acc-grad)" opacity="0.5">&#8220;</text>

  {# Quote text: autofit via slot metrics, wrapped lines #}
  {% set quote_lines = quote_lines %}
  {% set max_lines = quote_lines | length %}
  <g id="f-quote" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="600" fill="#cdd6f4">
    {% set ns = namespace(y = 430) %}
    {% for i in range(12) %}
      {% if i < max_lines %}
        {% set line = quote_lines[i] %}
        {% if line | length > 0 %}
        <text x="130" y="{{ ns.y }}">{{ line }}</text>
        {% set ns.y = ns.y + 54 %}
        {% endif %}
      {% endif %}
    {% endfor %}
  </g>

  {# Star rating: 5 stars, filled per `stars` (0-5), drawn as SVG paths #}
  {% set star_count = slide.stars | default(5) %}
  {% if star_count > 0 %}
  <g id="f-stars">
    {% for i in range(5) %}
    <g transform="translate({{ 130 + i * 64 }}, 760)">
      {% if i < star_count %}
      <path d="M20 0 L24.7 13.3 L39 13.5 L27.5 22 L31.8 35.5 L20 27.5 L8.2 35.5 L12.5 22 L1 13.5 L15.3 13.3 Z" fill="url(#acc-grad)"/>
      {% else %}
      <path d="M20 0 L24.7 13.3 L39 13.5 L27.5 22 L31.8 35.5 L20 27.5 L8.2 35.5 L12.5 22 L1 13.5 L15.3 13.3 Z" fill="none" stroke="#7f849c" stroke-width="2"/>
      {% endif %}
    </g>
    {% endfor %}
  </g>
  {% endif %}

  {# Attribution: avatar initial + name + role @ company #}
  <g id="chrome">
  <circle cx="160" cy="980" r="40" fill="url(#acc-grad)"/>
  {% set initial = slide.name | default('?') | list | first | upper %}
  <text x="160" y="992" text-anchor="middle" font-family="Inter,sans-serif" font-size="34" font-weight="800" fill="#1e1e2e">{{ initial }}</text>
  </g>
  <g id="f-name">
  <text x="225" y="975" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#cdd6f4">{{ slide.name }}</text>
  </g>
  <g id="f-role">
  <text x="225" y="1012" font-family="Inter,sans-serif" font-size="22" fill="#a6adc8">{{ slide.role | default('') }}{% if slide.role and slide.company %} · {% endif %}{{ slide.company | default('') }}</text>
  </g>

  {# Accent underline #}
  <g id="brand">
  <rect x="70" y="1210" width="940" height="4" rx="2" fill="url(#acc-grad)" opacity="0.85"/>

  {% if brand.show_brand %}
  <text x="540" y="1270" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}{% if brand.brand_handle %} · {{ brand.brand_handle }}{% endif %}</text>
  {% endif %}
  </g>
</svg>
