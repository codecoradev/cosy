<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg-grad)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <text x="540" y="500" text-anchor="middle" font-family="Inter,sans-serif" font-size="56" font-weight="800" fill="#cdd6f4">
    {% for line in quote_lines %}<tspan x="540" dy="{% if loop.first %}0{% else %}72{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not quote_lines %}<tspan x="540" dy="0">{{ slide.quote }}</tspan>{% endif %}
  </text>
  <rect x="440" y="1050" width="200" height="6" rx="3" fill="url(#acc-grad)"/>
  <text x="540" y="1120" text-anchor="middle" font-family="Inter,sans-serif" font-size="32" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.author }}</text>
  <text x="540" y="1250" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="400" fill="#7f849c">{{ brand.brand_name | default('') }} · {{ brand.brand_handle | default('') }}</text>
</svg>
