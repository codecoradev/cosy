<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <text x="540" y="120" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="700" fill="url(#acc-grad)">
{% for line in title_lines %}    <tspan x="540" dy="{% if loop.first %}0{% else %}58{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="540">{{ slide.title }}</tspan>{% endif %}
  </text>
  <line x1="540" y1="250" x2="540" y2="1200" stroke="url(#acc-grad)" stroke-width="3" opacity="0.3"/>
  {% set milestones = [
    (slide.milestone1_date, slide.milestone1_text, milestone1_text_lines),
    (slide.milestone2_date, slide.milestone2_text, milestone2_text_lines),
    (slide.milestone3_date, slide.milestone3_text, milestone3_text_lines),
    (slide.milestone4_date, slide.milestone4_text, milestone4_text_lines)
  ] %}
  {% for ms in milestones %}
  {% if ms[0] %}
  {% set y_base = 300 + loop.index0 * 230 %}
  <circle cx="540" cy="{{ y_base }}" r="20" fill="url(#acc-grad)"/>
  <circle cx="540" cy="{{ y_base }}" r="10" fill="#1e1e2e"/>
  <text x="450" y="{{ y_base - 5 }}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="24" font-weight="700" fill="url(#acc-grad)">{{ ms[0] }}</text>
  {% if ms[2] %}
    {% for line in ms[2] %}
  <text x="630" y="{{ y_base - 10 + loop.index0 * 34 }}" font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="#cdd6f4">{{ line }}</text>
    {% endfor %}
  {% else %}
  <text x="630" y="{{ y_base + 5 }}" font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="#cdd6f4">{{ ms[1] }}</text>
  {% endif %}
  {% endif %}
  {% endfor %}
  <text x="540" y="1270" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% if logo_data_uri %}
  <image href="{{ logo_data_uri }}" x="952" y="1282" height="48" preserveAspectRatio="xMidYMid meet"/>
  {% endif %}
</svg>