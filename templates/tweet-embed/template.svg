<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="675" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="675" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="120" cy="130" r="50" fill="url(#acc-grad)" opacity="0.15"/>
  <text x="120" y="145" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="700" fill="url(#acc-grad)">{{ slide.name[:1] | upper }}</text>
  <text x="200" y="120" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#cdd6f4">{{ slide.name }}</text>
  <text x="200" y="155" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#7f849c">{{ slide.handle }}{% if slide.date %} &#xB7; {{ slide.date }}{% endif %}</text>
  <text x="100" y="280" font-family="Inter,sans-serif" font-size="30" font-weight="400" fill="#cdd6f4">
{% for line in tweet_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}42{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not tweet_lines %}<tspan x="100">{{ slide.tweet }}</tspan>{% endif %}
  </text>
  <!-- Action icons drawn as paths (bundled fonts lack these emoji glyphs) -->
  <g stroke="url(#acc-grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <g transform="translate(100 588) scale(1.3)">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
    </g>
    <g transform="translate(240 588) scale(1.3)">
      <path d="m17 2 4 4-4 4"/>
      <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
      <path d="m7 22-4-4 4-4"/>
      <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
    </g>
    <g transform="translate(410 588) scale(1.3)">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    </g>
  </g>
  <g font-family="Inter,sans-serif" font-size="26" font-weight="500" fill="url(#acc-grad)" opacity="0.75">
    <text x="144" y="611">reply</text>
    <text x="284" y="611">retweet</text>
    <text x="454" y="611">like</text>
  </g>
  {% if brand.show_brand %}
  <text x="600" y="645" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>