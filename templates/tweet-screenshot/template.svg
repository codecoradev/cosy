<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="body-clip"><rect x="130" y="290" width="820" height="700"/></clipPath>
  </defs>

  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <g id="bg">
  <rect width="1080" height="1350" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}{{ brand.bg_overlay_opacity | default(0.7) }}{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  </g>

  {# Post card #}
  <rect x="70" y="90" width="940" height="1170" rx="32" fill="#181825" opacity="0.94"/>

  {# Header: avatar + name + handle + verified #}
  <g id="chrome">
  <circle cx="160" cy="185" r="42" fill="url(#acc-grad)"/>
  {% set initial = slide.display_name | default('?') | list | first | upper %}
  <text x="160" y="198" text-anchor="middle" font-family="Inter,sans-serif" font-size="38" font-weight="800" fill="#1e1e2e">{{ initial }}</text>
  </g>
  <g id="f-display_name">
  <text x="225" y="178" font-family="Inter,sans-serif" font-size="30" font-weight="700" fill="#cdd6f4">{{ slide.display_name }}</text>
  </g>
  {% if slide.verified | default(false) %}
  <g transform="translate({% set name_w = slide.display_name | default('') | length %}{{ 228 + name_w * 16 + 8 }}, 155)">
    <path d="M12 0 L16 6 L23 5 L23 12 L29 15 L23 18 L23 25 L16 24 L12 30 L8 24 L1 25 L1 18 L-5 15 L1 12 L1 5 L8 6 Z" fill="url(#acc-grad)" transform="scale(0.55)"/>
    <path d="M8.5 15 L11 17.5 L16 12.5" stroke="#1e1e2e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  {% endif %}
  <g id="f-handle">
  <text x="228" y="212" font-family="Inter,sans-serif" font-size="24" fill="#7f849c">{{ slide.handle }}</text>
  </g>

  {# Body: markup-aware wrapped text, up to 15 lines in the clip window #}
  {% set body_lines = body_lines %}
  {% set seg_lines = body_segments %}
  <g id="f-body" clip-path="url(#body-clip)" font-family="Inter,sans-serif" font-size="30" fill="#cdd6f4">
    {% set max_lines = body_lines | length %}
    {% set ns = namespace(y = 330) %}
    {% for i in range(15) %}
      {% if i < max_lines %}
        {% set plain_line = body_lines[i] %}
        {% if seg_lines is defined and seg_lines | length > i %}
          {% set seg_line = seg_lines[i] %}
          <text x="130" y="{{ ns.y }}">{% for seg in seg_line %}{% if seg.b %}<tspan font-weight="800">{% if seg.c %}<tspan fill="{{ seg.c }}">{{ seg.t }}</tspan>{% else %}{{ seg.t }}{% endif %}</tspan>{% elif seg.i %}<tspan font-style="italic">{{ seg.t }}</tspan>{% elif seg.c %}<tspan fill="{{ seg.c }}">{{ seg.t }}</tspan>{% else %}{{ seg.t }}{% endif %}{% endfor %}</text>
        {% else %}
          <text x="130" y="{{ ns.y }}">{{ plain_line }}</text>
        {% endif %}
        {% set ns.y = ns.y + 46 %}
      {% endif %}
    {% endfor %}
  </g>

  {# Timestamp #}
  <g id="f-timestamp">
  <text x="130" y="1060" font-family="Inter,sans-serif" font-size="22" fill="#7f849c">{{ slide.timestamp | default('') }}</text>
  <line x1="130" y1="1090" x2="950" y2="1090" stroke="#313244" stroke-width="2"/>
  </g>

  {# Engagement row: icons as inline SVG shapes (no emoji) #}
  <g id="f-replies">
  <g transform="translate(130, 1128)" fill="none" stroke="#7f849c" stroke-width="2.4">
    <path d="M3 3 L25 3 L25 21 L14 21 L7 27 L7 21 L3 21 Z" stroke-linejoin="round"/>
  </g>
  <text x="166" y="1148" font-family="Inter,sans-serif" font-size="24" fill="#a6adc8">{{ slide.replies | default('') }}</text>
  </g>
  <g id="f-reposts">
  <g transform="translate(420, 1128)" fill="none" stroke="#7f849c" stroke-width="2.4">
    <path d="M8 12 L8 6 L22 6 M18 2 L22 6 L18 10"/>
    <path d="M20 16 L20 22 L6 22 M10 18 L6 22 L10 26"/>
  </g>
  <text x="470" y="1148" font-family="Inter,sans-serif" font-size="24" fill="#a6adc8">{{ slide.reposts | default('') }}</text>
  </g>
  <g id="f-likes">
  <g transform="translate(720, 1130)" fill="none" stroke="#7f849c" stroke-width="2.4">
    <path d="M14 24 C14 24 2 16 2 8 C2 3 6 1 9 1 C11 1 13 2 14 4 C15 2 17 1 19 1 C22 1 26 3 26 8 C26 16 14 24 14 24 Z"/>
  </g>
  <text x="760" y="1148" font-family="Inter,sans-serif" font-size="24" fill="#a6adc8">{{ slide.likes | default('') }}</text>
  </g>

  {# Accent underline #}
  <g id="brand">
  <rect x="70" y="1210" width="940" height="4" rx="2" fill="url(#acc-grad)" opacity="0.85"/>

  {% if brand.show_brand %}
  <text x="540" y="1270" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}{% if brand.brand_handle %} · {{ brand.brand_handle }}{% endif %}</text>
  {% endif %}
  </g>
</svg>
