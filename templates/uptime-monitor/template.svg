<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1080" height="1080" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <text x="540" y="100" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  <rect x="340" y="150" width="400" height="120" rx="20" fill="#313244" opacity="0.15"/>
  <text x="540" y="210" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="#a6e3a1">{{ slide.overall_uptime }}</text>
  <text x="540" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" fill="#7f849c">Overall Uptime</text>
  {% set services = [(slide.s1_name, slide.s1_status), (slide.s2_name, slide.s2_status), (slide.s3_name, slide.s3_status), (slide.s4_name, slide.s4_status)] %}
  {% for sv in services %}
  {% if sv[0] %}
  {% set is_up = sv[1] == 'up' or sv[1] == 'UP' or sv[1] == 'Up' %}
  <rect x="100" y="{{ 330 + loop.index0 * 130 }}" width="880" height="90" rx="12" fill="#313244" opacity="0.12"/>
  <circle cx="150" cy="{{ 375 + loop.index0 * 130 }}" r="12" fill="{% if is_up %}#a6e3a1{% else %}#f38ba8{% endif %}" opacity="0.8"/>
  <text x="190" y="{{ 382 + loop.index0 * 130 }}" font-family="Inter,sans-serif" font-size="24" font-weight="500" fill="#cdd6f4">{{ sv[0] }}</text>
  <text x="920" y="{{ 382 + loop.index0 * 130 }}" text-anchor="end" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="{% if is_up %}#a6e3a1{% else %}#f38ba8{% endif %}">{{ sv[1] }}</text>
  {% endif %}
  {% endfor %}
  {% if brand.show_brand %}
  <text x="540" y="1040" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
  {% endif %}
</svg>