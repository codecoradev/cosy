<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
{% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="22" font-weight="700" fill="#cdd6f4">{{ slide.title }}</text>
  {% set is_up = slide.delta_dir == 'up' or slide.delta_dir == 'Up' %}
  <rect x="80" y="100" width="520" height="260" rx="20" fill="#313244" opacity="0.1"/>
  <text x="340" y="150" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">Previous</text>
  <text x="340" y="210" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="28" fill="#7f849c">{{ slide.v_old }}</text>
  <text x="340" y="290" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="#7f849c">{{ slide.old_val }}</text>
  <text x="340" y="330" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#7f849c">{{ slide.metric }}</text>
  <text x="600" y="240" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="40" font-weight="800" fill="{% if is_up %}#a6e3a1{% else %}#f38ba8{% endif %}">{{ slide.delta }} {% if is_up %}&#x2191;{% else %}&#x2193;{% endif %}</text>
  <rect x="600" y="100" width="520" height="260" rx="20" fill="url(#acc-grad)" opacity="0.08"/>
  <rect x="600" y="100" width="520" height="6" rx="8" fill="url(#acc-grad-h)" opacity="0.4"/>
  <text x="860" y="150" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#89b4fa">Current</text>
  <text x="860" y="210" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="28" fill="#cdd6f4">{{ slide.v_new }}</text>
  <text x="860" y="290" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="48" font-weight="800" fill="url(#acc-grad)">{{ slide.new_val }}</text>
  <text x="860" y="330" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#89b4fa">{{ slide.metric }}</text>
  <text x="600" y="615" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>