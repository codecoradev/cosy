<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  {% if bg_image_data_uri %}
  <image href="{{ bg_image_data_uri }}" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="{{ brand.bg_image_opacity | default(0.15) }}"/>
  {% endif %}
  <rect width="1200" height="630" fill="url(#bg-grad)" opacity="{% if bg_image_data_uri %}0.7{% else %}1.0{% endif %}"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="80" y="130" width="100" height="44" rx="12" fill="#a6e3a1" opacity="0.15"/>
  <text x="130" y="160" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="20" font-weight="800" fill="#a6e3a1">{{ slide.method | upper }}</text>
  <text x="210" y="160" font-family="JetBrains Mono,monospace" font-size="24" font-weight="600" fill="#cdd6f4">{{ slide.endpoint }}</text>
  {% if slide.description %}
  <text x="100" y="230" font-family="Inter,sans-serif" font-size="22" font-weight="400" fill="#a6adc8">
{% for line in description_lines %}    <tspan x="100" dy="{% if loop.first %}0{% else %}32{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not description_lines %}<tspan x="100">{{ slide.description }}</tspan>{% endif %}
  </text>
  {% endif %}
  <rect x="80" y="370" width="1040" height="200" rx="12" fill="#11111b" opacity="0.6"/>
  <rect x="80" y="370" width="1040" height="200" rx="12" fill="none" stroke="#313244" stroke-width="1"/>
  <text x="110" y="410" font-family="JetBrains Mono,monospace" font-size="16" fill="#7f849c">// Response</text>
  <text x="110" y="450" font-family="JetBrains Mono,monospace" font-size="22" font-weight="500" fill="#a6e3a1">{{ slide.status_code }} OK</text>
  {% if slide.response_field %}
  <text x="110" y="490" font-family="JetBrains Mono,monospace" font-size="20" fill="#7f849c">{</text>
  <text x="140" y="520" font-family="JetBrains Mono,monospace" font-size="20" fill="#89b4fa">"{{ slide.response_field }}":</text>
  <text x="440" y="520" font-family="JetBrains Mono,monospace" font-size="20" fill="#f9e2af">"{{ slide.response_type | default('string') }}"</text>
  <text x="110" y="550" font-family="JetBrains Mono,monospace" font-size="20" fill="#7f849c">}</text>
  {% endif %}
  <text x="600" y="600" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>