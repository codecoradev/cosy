<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.bg_color | default('#1e1e2e') }}"/>
      <stop offset="100%" stop-color="{{ brand.bg_color_end | default('#11111b') }}"/>
    </linearGradient>
    <linearGradient id="acc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}"/>
      <stop offset="100%" stop-color="{{ brand.accent_color_end | default('#89b4fa') }}"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="{{ brand.accent_color | default('#cba6f7') }}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-grad)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  {% if slide.episode %}
  <text x="80" y="120" font-family="JetBrains Mono,monospace" font-size="36" font-weight="700" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.episode }}</text>
  {% endif %}
  <text x="80" y="360" font-family="Inter,sans-serif" font-size="68" font-weight="800" fill="#cdd6f4">
    {% for line in title_lines %}<tspan x="80" dy="{% if loop.first %}0{% else %}80{% endif %}">{{ line }}</tspan>{% endfor %}
    {% if not title_lines %}<tspan x="80" dy="0">{{ slide.title }}</tspan>{% endif %}
  </text>
  <rect x="80" y="580" width="200" height="6" rx="3" fill="url(#acc-grad)"/>
  {% if slide.tag %}
  <text x="1200" y="620" text-anchor="end" font-family="Inter,sans-serif" font-size="28" font-weight="600" fill="{{ brand.accent_color | default('#cba6f7') }}">{{ slide.tag }}</text>
  {% endif %}
  <text x="80" y="630" font-family="Inter,sans-serif" font-size="24" font-weight="600" fill="#7f849c">{{ brand.brand_name | default('') }}</text>
</svg>
